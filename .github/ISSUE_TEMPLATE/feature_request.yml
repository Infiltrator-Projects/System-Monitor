# SPDX-License-Identifier: GPL-3.0-or-later
name: Feature request
description: Propose an improvement to System Monitor.
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or user need does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour, hardware support or interface you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CPU / memory
        - Storage / filesystems
        - Network / Wi-Fi
        - GPU
        - NPU / accelerator
        - Battery / peripherals
        - Processes / controls
        - Startup / users / services
        - Interface / layout
        - Packaging / installer
        - Build / CI / release
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Include relevant hardware, driver or interface documentation when applicable.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same request.
          required: true
