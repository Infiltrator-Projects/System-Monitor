name: One-shot native release-path gate correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-release-path-gate.yml
      - support/tools/one_shot_fix_release_path_gate.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Align release gate with native package path
        run: python3 support/tools/one_shot_fix_release_path_gate.py
      - name: Commit release gate correction
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml
          git diff --cached --check
          git config user.name 'The-First-Infiltrator'
          git config user.email 'The-First-Infiltrator@users.noreply.github.com'
          git commit -m 'Align release gate with native program path'
          git push origin HEAD:main
