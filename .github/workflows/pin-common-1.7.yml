name: pin-common-1.7

on:
  push:
    branches: [refactor/app-boundaries-1.13.14]
    paths:
      - .github/workflows/pin-common-1.7.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refactor/app-boundaries-1.13.14
          fetch-depth: 0
          submodules: false

      - name: Pin final Common 1.7.0 release commit
        shell: bash
        run: |
          set -euo pipefail
          old=f7cc14f074d30f0374ea8b05cd4bd507ecc40427
          new=462e383d0326c2e8c81d9cbfccaecd344f145d26
          sed -i "s/$old/$new/g" CMakeLists.txt Makefile
          git update-index --add --cacheinfo 160000,$new,src/infiltratr-common
          rm .github/workflows/pin-common-1.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt Makefile .github/workflows/pin-common-1.7.yml
          git commit -m "Pin Infiltratr Common 1.7.0 release"
          git push origin HEAD:refactor/app-boundaries-1.13.14
