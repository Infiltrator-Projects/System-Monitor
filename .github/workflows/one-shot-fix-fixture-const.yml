name: One-shot strict fixture cleanup correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-fixture-const.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Preserve const-correct strict compilation
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/const char \*commands\[\]\[4\]/char *commands[][4]/' support/tests/native_installer_safety.c
          sed -i 's/arguments\[count++\] = (char \*)commands\[index\]\[part\];/arguments[count++] = commands[index][part];/' support/tests/native_installer_safety.c
          grep -Fq 'char *commands[][4]' support/tests/native_installer_safety.c
          ! grep -Fq '(char *)commands[index][part]' support/tests/native_installer_safety.c
          git rm .github/workflows/one-shot-fix-fixture-const.yml
          git add support/tests/native_installer_safety.c
          git diff --cached --check
          git config user.name 'The-First-Infiltrator'
          git config user.email 'The-First-Infiltrator@users.noreply.github.com'
          git commit -m 'Keep native installer fixture warning-clean'
          git push origin HEAD:main
