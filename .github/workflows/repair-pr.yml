# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply audited repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'audit-repair-1.13.17'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repair branch and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit-repair-1.13.17
          fetch-depth: 0
          submodules: recursive

      - name: Apply audited changes
        shell: bash
        run: |
          set -euo pipefail
          git -C src/infiltratr-common fetch --depth=1 origin 6c1a6c239e51dcf7946b6303a9bad639e8455a17
          git -C src/infiltratr-common checkout --detach 6c1a6c239e51dcf7946b6303a9bad639e8455a17
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.11.0"
          python3 support/tools/repair_audit.py

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-multilib git libc6-dev-i386 \
            libgtk-3-dev pkg-config unzip zip

      - name: Verify CMake path
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify Make, portability and sanitizers
        run: |
          REQUIRE_I386=1 make check
          make sanitizer-check

      - name: Verify three release artifacts
        run: |
          make -j2 release
          test -f linux-system-monitor_1.13.17_amd64.deb
          test -x linux-system-monitor-1.13.17-native-installer.run
          test -f Linux-System-Monitor-1.13.17-source.zip
          test "$(unzip -p Linux-System-Monitor-1.13.17-source.zip '*/src/infiltratr-common/VERSION' | tr -d '[:space:]')" = "1.11.0"

      - name: Persist verified non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          # The GitHub Actions token cannot safely rewrite workflow definitions.
          # Leave those two generated workflow edits for the authenticated connector.
          git restore .github/workflows/ci.yml .github/workflows/release.yml
          rm support/tools/repair_audit.py
          git diff --check
          git add CMakeLists.txt Makefile README.md \
                  support/tools/check_source_style.c \
                  support/tools/repair_audit.py
          git diff --cached --check
          git config user.name "Shannon Smith"
          git config user.email "The-First-Infiltrator@users.noreply.github.com"
          git commit -m "Harden System Monitor Common and source contracts" -m "Adopt Infiltratr Common 1.11 through its authoritative build targets, restore the standalone source ZIP contract, make ILP32 portability mechanically non-regressible, and remove the temporary repair transformer."
          git push origin HEAD:audit-repair-1.13.17
