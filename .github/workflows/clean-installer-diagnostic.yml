# SPDX-License-Identifier: GPL-3.0-or-later
name: Diagnose clean installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install clean-host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git libgtk-3-dev pkg-config

      - name: Build deterministic native installer
        shell: bash
        run: |
          set -euo pipefail
          make native-installer
          version=$(tr -d '[:space:]' < support/VERSION)
          test -x "infiltrator-system-monitor-${version}-native-installer.run"

      - name: Exercise root and ordinary-user aggressive PGO paths
        id: exercise
        shell: bash
        run: |
          set -uo pipefail
          ulimit -s 65536
          version=$(tr -d '[:space:]' < support/VERSION)
          installer="infiltrator-system-monitor-${version}-native-installer.run"
          root_log="$RUNNER_TEMP/system-monitor-root-install.log"
          user_log="$RUNNER_TEMP/system-monitor-user-install.log"

          set +e
          sudo ./"$installer" --profile aggressive --system-package-mode 2>&1 | tee "$root_log"
          root_rc=${PIPESTATUS[0]}
          if ((root_rc == 0)); then
            ./"$installer" --profile aggressive --skip-tests 2>&1 | tee "$user_log"
            user_rc=${PIPESTATUS[0]}
          else
            user_rc=125
            printf 'ordinary-user pass skipped because root pass failed\n' | tee "$user_log"
          fi
          set -e

          printf 'root_rc=%d\nuser_rc=%d\n' "$root_rc" "$user_rc" | tee "$RUNNER_TEMP/system-monitor-installer-status.txt"
          if ((root_rc != 0 || user_rc != 0)); then
            exit 1
          fi
          if grep -Fq 'stringop-overread' "$user_log"; then
            printf 'Aggressive PGO build emitted a stringop-overread diagnostic.\n' >&2
            exit 1
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-monitor-clean-installer-diagnostics
          path: |
            ${{ runner.temp }}/system-monitor-root-install.log
            ${{ runner.temp }}/system-monitor-user-install.log
            ${{ runner.temp }}/system-monitor-installer-status.txt
          if-no-files-found: warn
