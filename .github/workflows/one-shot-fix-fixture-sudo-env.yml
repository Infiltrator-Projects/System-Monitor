name: One-shot fixture sudo environment correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-fixture-sudo-env.yml
      - support/tools/one_shot_fix_fixture_sudo_env.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 support/tools/one_shot_fix_fixture_sudo_env.py
      - shell: bash
        run: |
          set -euo pipefail
          git add support/tests/native_installer_safety.c
          git diff --cached --check
          git config user.name 'The-First-Infiltrator'
          git config user.email 'The-First-Infiltrator@users.noreply.github.com'
          git commit -m 'Preserve fixture log across mock sudo boundary'
          git push origin HEAD:main
