# Temporary one-shot cleanup of superseded release v1.0.36.
name: Remove superseded v1.0.36

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.36 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.0.36 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if gh release view v1.0.36 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.36 still exists" >&2
            exit 1
          fi
          echo "Superseded v1.0.36 release and tag removed."
