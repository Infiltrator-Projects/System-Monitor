# SPDX-License-Identifier: GPL-3.0-or-later
name: One-time fix preferences smoke

on:
  push:
    branches:
      - refactor/app-boundaries-1.13.14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/app-boundaries-1.13.14
          fetch-depth: 0

      - name: Repair Common linkage for preferences smoke
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          s = p.read_text()

          old_targets = "\tcpu-accounting-smoke system-snapshot-smoke process-export-smoke \\\n\tquality-policy-smoke"
          new_targets = "\tcpu-accounting-smoke system-snapshot-smoke process-export-smoke \\\n\tquality-policy-smoke preferences-smoke"
          if old_targets not in s:
              raise SystemExit("COMMON_LINK_TARGETS anchor not found")
          s = s.replace(old_targets, new_targets, 1)

          old_link = "\t\tsrc/preferences.c src/atomic_file_posix.c \\\n\t\t-Wl,--gc-sections -l:libglib-2.0.so.0 -lm \\\n"
          new_link = "\t\tsrc/preferences.c src/atomic_file_posix.c \\\n\t\t$(INFILTRATR_COMMON_ARCHIVE) \\\n\t\t-Wl,--gc-sections -l:libglib-2.0.so.0 -lm \\\n"
          if old_link not in s:
              raise SystemExit("preferences-smoke link anchor not found")
          s = s.replace(old_link, new_link, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- Makefile

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile
          git diff --cached --quiet && exit 0
          git commit -m "Link preferences smoke against Common"
          git push origin HEAD:refactor/app-boundaries-1.13.14
