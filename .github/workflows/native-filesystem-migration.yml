# SPDX-License-Identifier: GPL-3.0-or-later
name: Native filesystem migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-filesystem-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Apply native filesystem migration
        run: python3 support/tools/migrate_native_filesystem.py
      - name: Commit native filesystem release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The-First-Infiltrator'
          git config user.email 'The-First-Infiltrator@users.noreply.github.com'
          git add Makefile support/VERSION support/tools/build_deb_package.c support/tools/native_installer.c docs/CHANGELOG.md docs/ARCHITECTURE.md .github/README.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'Migration already applied.'; exit 0; }
          git commit -m 'Release System Monitor 1.0.209 native filesystem layout'
          git push origin HEAD:main
