name: One-shot native-installer fixture correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-native-installer-fixture.yml
      - support/tools/one_shot_fix_native_installer_fixture.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Correct package-install simulation
        run: python3 support/tools/one_shot_fix_native_installer_fixture.py
      - name: Commit fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-native-installer-fixture.yml support/tools/one_shot_fix_native_installer_fixture.py
          git add support/tests/native_installer_safety.c
          git diff --cached --check
          git config user.name 'The-First-Infiltrator'
          git config user.email 'The-First-Infiltrator@users.noreply.github.com'
          git commit -m 'Fix native installer package safety fixture'
          git push origin HEAD:main
