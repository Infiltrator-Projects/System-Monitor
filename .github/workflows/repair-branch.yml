# SPDX-License-Identifier: GPL-3.0-or-later
# Triggered once after the temporary PR branch is created.
name: Prepare audited repair

on:
  push:
    branches: [audit-repair-1.13.17]
    paths:
      - '.github/workflows/repair-branch.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repair branch and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply audited changes
        shell: bash
        run: |
          set -euo pipefail
          git -C src/infiltratr-common fetch --depth=1 origin 6c1a6c239e51dcf7946b6303a9bad639e8455a17
          git -C src/infiltratr-common checkout --detach 6c1a6c239e51dcf7946b6303a9bad639e8455a17
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.11.0"
          python3 support/tools/repair_audit.py

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-multilib git libc6-dev-i386 \
            libgtk-3-dev pkg-config unzip zip

      - name: Verify CMake path
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify Make, portability and sanitizers
        run: |
          REQUIRE_I386=1 make check
          make sanitizer-check

      - name: Verify three release artifacts
        run: |
          make -j2 release
          test -f linux-system-monitor_1.13.17_amd64.deb
          test -x linux-system-monitor-1.13.17-native-installer.run
          test -f Linux-System-Monitor-1.13.17-source.zip
          test "$(unzip -p Linux-System-Monitor-1.13.17-source.zip '*/src/infiltratr-common/VERSION' | tr -d '[:space:]')" = "1.11.0"

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-branch.yml support/tools/repair_audit.py
          git diff --check
          expected=$(printf '%s\n' \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/repair-branch.yml \
            CMakeLists.txt Makefile README.md src/infiltratr-common \
            support/tools/check_source_style.c \
            support/tools/repair_audit.py | sort)
          actual=$(git status --short | sed 's/^...//' | sort)
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected repair file set.\nExpected:\n%s\nActual:\n%s\n' \
              "$expected" "$actual" >&2
            exit 1
          fi
          git config user.name "Shannon Smith"
          git config user.email "The-First-Infiltrator@users.noreply.github.com"
          git add -A
          git commit -m "Harden System Monitor release and Common contracts" -m "Adopt Infiltratr Common 1.11 through its authoritative build targets, restore the standalone source ZIP release asset, require release tags to come from main, make ILP32 portability mandatory in CI, and lock the repaired contracts into the source audit."
          git push origin HEAD:audit-repair-1.13.17
