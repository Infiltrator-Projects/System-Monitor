# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-app-boundaries:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/app-boundaries-1.13.14'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refactor/app-boundaries-1.13.14
          fetch-depth: 0
          submodules: recursive

      - name: Refactor application boundaries and consume Common 1.7
        shell: bash
        run: |
          set -euo pipefail

          git -C src/infiltratr-common fetch origin f7cc14f074d30f0374ea8b05cd4bd507ecc40427 --depth=1
          git -C src/infiltratr-common checkout --detach f7cc14f074d30f0374ea8b05cd4bd507ecc40427

          cat > src/app.h <<'EOF'
          // SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file app.h
           * @brief Opaque lifetime boundary for the Linux System Monitor application.
           *
           * Feature modules receive LsmApp pointers through their own interfaces; the
           * concrete GTK/state layout is private to app_internal.h. Keeping this public
           * boundary opaque prevents main.c and unrelated consumers from depending on
           * the complete application object.
           *
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #ifndef LINUX_SYSTEM_MONITOR_APP_H
          #define LINUX_SYSTEM_MONITOR_APP_H

          #include <gtk/gtk.h>

          typedef struct LsmApp LsmApp;

          /** Allocate a zeroed application context. */
          LsmApp *lsm_app_create(void);
          /** Release an application context after lsm_app_shutdown(). */
          void lsm_app_free(LsmApp *app);
          /** Construct the single-window GUI on first activation or present it again. */
          void lsm_app_activate(GtkApplication *application, gpointer user_data);
          /** Stop timers, workers and owned state; safe for repeated calls. */
          void lsm_app_shutdown(LsmApp *app);
          /** Recreate fast presentation timers after refresh preferences change. */
          void lsm_app_preferences_changed(LsmApp *app);

          #endif
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Recover the old concrete application layout from main for one final time.
          old = subprocess_text = None
          import subprocess
          old = subprocess.check_output(
              ['git', 'show', 'origin/main:src/app.h'], text=True)
          start = old.index('typedef struct LsmProcessBackend')
          end_marker = '} LsmApp;'
          end = old.index(end_marker, start) + len(end_marker)
          body = old[start:end]
          body = body.replace('typedef struct LsmApp {', 'struct LsmApp {', 1)
          body = body.replace('} LsmApp;', '};', 1)
          internal = '''// SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file app_internal.h
           * @brief Private GTK application state shared only by implementation modules.
           *
           * This header intentionally contains the complete LsmApp layout. Public and
           * feature interfaces use the opaque declaration in app.h instead.
           *
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #ifndef LINUX_SYSTEM_MONITOR_APP_INTERNAL_H
          #define LINUX_SYSTEM_MONITOR_APP_INTERNAL_H

          #include "app.h"
          #include "app_config.h"
          #include "graph.h"
          #include "gpu_metrics.h"
          #include "monitor_types.h"
          #include "performance_selection.h"

          #include <stdio.h>

          ''' + body + '''

          #endif
          '''
          Path('src/app_internal.h').write_text(internal)

          Path('src/app_runtime.h').write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file app_runtime.h
           * @brief Internal refresh-cadence and timer coordination API.
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #ifndef LINUX_SYSTEM_MONITOR_APP_RUNTIME_H
          #define LINUX_SYSTEM_MONITOR_APP_RUNTIME_H

          #include "app.h"

          /** Refresh the shared process snapshot when its effective cadence is due. */
          gboolean lsm_app_refresh_processes_if_due(LsmApp *app, gboolean force);
          /** Refresh all user-visible inventories once, preserving pause state. */
          void lsm_app_refresh_all(LsmApp *app);
          /** Start application-owned recurring refresh sources. */
          void lsm_app_runtime_start(LsmApp *app);
          /** Stop and clear application-owned recurring refresh sources. */
          void lsm_app_runtime_stop(LsmApp *app);

          #endif
          ''')

          Path('src/app_runtime.c').write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file app_runtime.c
           * @brief GTK-main-loop refresh cadence and timer ownership.
           *
           * This module owns when application refresh callbacks run. Feature modules
           * continue to own what they collect and present.
           *
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #include "app_runtime.h"
          #include "app_internal.h"

          #include "common.h"
          #include "filesystems.h"
          #include "history.h"
          #include "performance.h"
          #include "processes_ui.h"
          #include "refresh_policy.h"
          #include "services.h"
          #include "startup.h"
          #include "users.h"

          static guint process_refresh_interval(const LsmApp *app)
          {
              return app->runtime.update_interval_ms < 1000U
                  ? 1000U : app->runtime.update_interval_ms;
          }

          static gboolean process_pages_active(const LsmApp *app)
          {
              return app->runtime.active_tab == LSM_TAB_PROCESSES ||
                     app->runtime.active_tab == LSM_TAB_DETAILS;
          }

          static guint effective_process_refresh_interval(const LsmApp *app)
          {
              const guint foreground = process_refresh_interval(app);
              if (process_pages_active(app) || app->process.record_file)
                  return foreground;
              return foreground < LSM_PROCESS_UPDATE_INTERVAL_MS
                  ? LSM_PROCESS_UPDATE_INTERVAL_MS : foreground;
          }

          gboolean lsm_app_refresh_processes_if_due(LsmApp *app, gboolean force)
          {
              if (!app || (app->runtime.paused && !force))
                  return G_SOURCE_CONTINUE;

              const double now = lsm_monotonic_seconds();
              const double interval =
                  (double)effective_process_refresh_interval(app) / 1000.0;
              if (!force && !lsm_refresh_interval_due(
                                now,
                                app->runtime.last_process_refresh_monotonic,
                                interval))
                  return G_SOURCE_CONTINUE;

              const gboolean result = lsm_processes_update(app);
              if (now > 0.0)
                  app->runtime.last_process_refresh_monotonic = now;
              return result;
          }

          static gboolean process_timer_update(gpointer user_data)
          {
              return lsm_app_refresh_processes_if_due(user_data, FALSE);
          }

          void lsm_app_refresh_all(LsmApp *app)
          {
              if (!app) return;
              const gboolean was_paused = app->runtime.paused;
              app->runtime.paused = FALSE;
              (void)lsm_app_refresh_processes_if_due(app, TRUE);
              lsm_performance_refresh(app);
              lsm_history_refresh(app);
              lsm_filesystems_refresh(app);
              lsm_startup_refresh(app);
              lsm_services_refresh(app);
              lsm_users_refresh(app);
              app->runtime.paused = was_paused;
          }

          void lsm_app_preferences_changed(LsmApp *app)
          {
              if (!app || !app->shell.window ||
                  (!app->runtime.performance_timer && !app->runtime.process_timer))
                  return;
              if (app->runtime.performance_timer)
                  g_source_remove(app->runtime.performance_timer);
              if (app->runtime.process_timer)
                  g_source_remove(app->runtime.process_timer);
              app->runtime.performance_timer = g_timeout_add(
                  app->runtime.update_interval_ms, lsm_performance_update, app);
              app->runtime.process_timer = g_timeout_add(
                  process_refresh_interval(app), process_timer_update, app);
          }

          void lsm_app_runtime_start(LsmApp *app)
          {
              if (!app) return;
              app->runtime.performance_timer = g_timeout_add(
                  app->runtime.update_interval_ms, lsm_performance_update, app);
              app->runtime.process_timer = g_timeout_add(
                  process_refresh_interval(app), process_timer_update, app);
              app->runtime.services_timer = g_timeout_add_seconds(
                  LSM_SERVICE_UPDATE_INTERVAL_SECONDS, lsm_services_update, app);
              app->runtime.users_timer = g_timeout_add_seconds(
                  LSM_USER_UPDATE_INTERVAL_SECONDS, lsm_users_update, app);
              app->runtime.filesystem_timer = g_timeout_add_seconds(
                  LSM_FILESYSTEM_UPDATE_INTERVAL_SECONDS, lsm_filesystems_update, app);
          }

          static void remove_source(guint *source)
          {
              if (!source || !*source) return;
              g_source_remove(*source);
              *source = 0U;
          }

          void lsm_app_runtime_stop(LsmApp *app)
          {
              if (!app) return;
              remove_source(&app->runtime.performance_timer);
              remove_source(&app->runtime.process_timer);
              remove_source(&app->runtime.services_timer);
              remove_source(&app->runtime.users_timer);
              remove_source(&app->runtime.filesystem_timer);
          }
          ''')

          Path('src/app_shell.h').write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file app_shell.h
           * @brief Internal global-window, menu and navigation coordination API.
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #ifndef LINUX_SYSTEM_MONITOR_APP_SHELL_H
          #define LINUX_SYSTEM_MONITOR_APP_SHELL_H

          #include "app.h"

          /** Build the global menu bar and bind application actions. */
          GtkWidget *lsm_app_shell_build_menu(LsmApp *app);
          /** Install the application CSS provider. */
          void lsm_app_shell_apply_css(void);
          /** Connect top-level window state, keyboard and close handlers. */
          void lsm_app_shell_connect_window(LsmApp *app);
          /** Connect notebook navigation and on-demand refresh handling. */
          void lsm_app_shell_connect_notebook(LsmApp *app);
          /** Apply compact-summary visibility and window geometry policy. */
          void lsm_app_shell_apply_compact_summary(LsmApp *app);
          /** Persist one page's current vertical scroll position. */
          void lsm_app_shell_save_page_scroll(LsmApp *app, gint page);
          /** Cancel deferred shell-only callbacks during shutdown. */
          void lsm_app_shell_cancel_pending(LsmApp *app);

          #endif
          ''')

          source = Path('src/app.c').read_text()
          menu_start = source.index('/* Menu callbacks contain presentation policy only;')
          runtime_start = source.index('static guint process_refresh_interval')
          runtime_end = source.index('static void on_speed_selected')
          activation_start = source.index('/* Application construction establishes ownership before starting timers. */')
          include_start = source.index('#include "app.h"')
          original_includes = source[include_start:menu_start]
          original_includes = original_includes.replace('#include "app.h"', '#include "app_internal.h"')

          shell = '''// SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file app_shell.c
           * @brief Global GTK shell, menus, window state and navigation policy.
           *
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #include "app_shell.h"
          #include "app_runtime.h"
          ''' + original_includes + source[menu_start:runtime_start] + r'''
          static void on_refresh(GtkMenuItem *item, gpointer user_data)
          {
              (void)item;
              lsm_app_refresh_all(user_data);
          }

          ''' + source[runtime_end:activation_start]
          shell = shell.replace('static void apply_compact_summary(',
                                'void lsm_app_shell_apply_compact_summary(')
          shell = shell.replace('apply_compact_summary(',
                                'lsm_app_shell_apply_compact_summary(')
          shell = shell.replace('static GtkWidget *build_menu(',
                                'GtkWidget *lsm_app_shell_build_menu(')
          shell = shell.replace('static void apply_css(void)',
                                'void lsm_app_shell_apply_css(void)')
          shell = shell.replace('static void save_page_scroll(LsmApp *app, gint page);\n', '')
          shell = shell.replace('static void save_page_scroll(',
                                'void lsm_app_shell_save_page_scroll(')
          shell = shell.replace('save_page_scroll(',
                                'lsm_app_shell_save_page_scroll(')
          shell = shell.replace('refresh_processes_if_due(',
                                'lsm_app_refresh_processes_if_due(')
          shell += r'''
          void lsm_app_shell_connect_window(LsmApp *app)
          {
              if (!app || !app->shell.window) return;
              g_signal_connect(app->shell.window, "delete-event",
                               G_CALLBACK(on_delete_event), app);
              g_signal_connect(app->shell.window, "configure-event",
                               G_CALLBACK(on_window_configure), app);
              g_signal_connect(app->shell.window, "window-state-event",
                               G_CALLBACK(on_window_state), app);
              g_signal_connect(app->shell.window, "key-press-event",
                               G_CALLBACK(on_key_press), app);
          }

          void lsm_app_shell_connect_notebook(LsmApp *app)
          {
              if (!app || !app->shell.notebook) return;
              g_signal_connect(app->shell.notebook, "switch-page",
                               G_CALLBACK(on_tab_switched), app);
          }

          void lsm_app_shell_cancel_pending(LsmApp *app)
          {
              if (!app || !app->runtime.window_restore_reflow_source) return;
              g_source_remove(app->runtime.window_restore_reflow_source);
              app->runtime.window_restore_reflow_source = 0U;
          }
          '''
          Path('src/app_shell.c').write_text(shell)

          life = source[activation_start:]
          life = life.replace('apply_css();', 'lsm_app_shell_apply_css();')
          life = life.replace('build_menu(app)', 'lsm_app_shell_build_menu(app)')
          life = life.replace('apply_compact_summary(app)',
                              'lsm_app_shell_apply_compact_summary(app)')
          life = life.replace('refresh_processes_if_due(app, TRUE)',
                              'lsm_app_refresh_processes_if_due(app, TRUE)')
          life = life.replace('save_page_scroll(app, app->runtime.active_tab)',
                              'lsm_app_shell_save_page_scroll(app, app->runtime.active_tab)')

          window_signals = '''    g_signal_connect(app->shell.window, "delete-event", G_CALLBACK(on_delete_event), app);
              g_signal_connect(app->shell.window, "configure-event",
                               G_CALLBACK(on_window_configure), app);
              g_signal_connect(app->shell.window, "window-state-event",
                               G_CALLBACK(on_window_state), app);
              g_signal_connect(app->shell.window, "key-press-event",
                               G_CALLBACK(on_key_press), app);
          '''
          if window_signals not in life:
              raise SystemExit('window signal block not found')
          life = life.replace(window_signals, '    lsm_app_shell_connect_window(app);\n')

          notebook_signal = '''    g_signal_connect(app->shell.notebook, "switch-page", G_CALLBACK(on_tab_switched), app);
          '''
          if notebook_signal not in life:
              raise SystemExit('notebook signal block not found')
          life = life.replace(notebook_signal, '    lsm_app_shell_connect_notebook(app);\n')

          timer_start = '''    app->runtime.performance_timer = g_timeout_add(app->runtime.update_interval_ms, lsm_performance_update, app);
              app->runtime.process_timer = g_timeout_add(process_refresh_interval(app), process_timer_update, app);
              app->runtime.services_timer = g_timeout_add_seconds(
                  LSM_SERVICE_UPDATE_INTERVAL_SECONDS, lsm_services_update, app);
              app->runtime.users_timer = g_timeout_add_seconds(
                  LSM_USER_UPDATE_INTERVAL_SECONDS, lsm_users_update, app);
              app->runtime.filesystem_timer = g_timeout_add_seconds(
                  LSM_FILESYSTEM_UPDATE_INTERVAL_SECONDS, lsm_filesystems_update, app);
          '''
          if timer_start not in life:
              raise SystemExit('timer start block not found')
          life = life.replace(timer_start, '    lsm_app_runtime_start(app);\n')

          runtime_stop_old = '''    if (app->runtime.performance_timer) g_source_remove(app->runtime.performance_timer);
              if (app->runtime.process_timer) g_source_remove(app->runtime.process_timer);
              if (app->runtime.services_timer) g_source_remove(app->runtime.services_timer);
          '''
          if runtime_stop_old not in life:
              raise SystemExit('runtime stop prefix not found')
          life = life.replace(runtime_stop_old, '    lsm_app_runtime_stop(app);\n')
          life = life.replace('    if (app->runtime.users_timer) g_source_remove(app->runtime.users_timer);\n', '')
          life = life.replace('    if (app->runtime.filesystem_timer) g_source_remove(app->runtime.filesystem_timer);\n', '')
          pending = '''    if (app->runtime.window_restore_reflow_source) {
                  g_source_remove(app->runtime.window_restore_reflow_source);
                  app->runtime.window_restore_reflow_source = 0U;
              }
          '''
          if pending not in life:
              raise SystemExit('shell pending block not found')
          life = life.replace(pending, '    lsm_app_shell_cancel_pending(app);\n')

          app_source = r'''// SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file app.c
           * @brief Application composition root and ordered lifecycle.
           *
           * Global shell policy and timer cadence live in dedicated modules; this file
           * owns construction order, subsystem lifetime and teardown order only.
           *
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #include "app.h"
          #include "app_internal.h"
          #include "app_runtime.h"
          #include "app_shell.h"

          #include "application_catalog.h"
          #include "details_page.h"
          #include "filesystems.h"
          #include "history.h"
          #include "monitor.h"
          #include "performance.h"
          #include "preferences.h"
          #include "process_backend.h"
          #include "process_inspector.h"
          #include "processes_ui.h"
          #include "services.h"
          #include "startup.h"
          #include "summary_bar.h"
          #include "users.h"

          #include <stdio.h>

          LsmApp *lsm_app_create(void)
          {
              return g_new0(LsmApp, 1);
          }

          void lsm_app_free(LsmApp *app)
          {
              g_free(app);
          }

          ''' + life
          Path('src/app.c').write_text(app_source)

          # Internal implementation modules explicitly opt into the concrete app state.
          for path in list(Path('src').glob('*.c')) + list(Path('support').rglob('*.c')):
              if path.name in {'main.c', 'app.c', 'app_shell.c', 'app_runtime.c'}:
                  continue
              text = path.read_text()
              if 'LsmApp' not in text and 'app->' not in text:
                  continue
              if '#include "app_internal.h"' in text:
                  continue
              if '#include "app.h"' in text:
                  text = text.replace('#include "app.h"', '#include "app_internal.h"', 1)
              else:
                  match = re.search(r'^#include "[^"]+"\n', text, re.MULTILINE)
                  if not match:
                      raise SystemExit(f'cannot place app_internal include in {path}')
                  text = text[:match.end()] + '#include "app_internal.h"\n' + text[match.end():]
              path.write_text(text)

          main = Path('src/main.c')
          text = main.read_text()
          text = text.replace('    LsmApp *app = g_new0(LsmApp, 1);',
                              '    LsmApp *app = lsm_app_create();\n    if (!app) return EXIT_FAILURE;')
          text = text.replace('    g_free(app);', '    lsm_app_free(app);')
          main.write_text(text)

          pref = Path('src/preferences.c')
          text = pref.read_text()
          if '#include <infiltratr/config.h>' not in text:
              insert = '#include <infiltratr/config.h>\n#include <infiltratr/core.h>\n\n'
              marker = '#include "processes_ui.h"\n\n'
              if marker not in text:
                  raise SystemExit('preferences include marker not found')
              text = text.replace(marker, marker + insert)
          start = text.index('static gboolean parse_boolean')
          end = text.index('static gboolean valid_stack_name')
          replacements = r'''static gboolean parse_boolean(const char *value, gboolean fallback)
          {
              bool parsed = false;
              return infiltratr_config_parse_bool(value, &parsed)
                  ? (parsed ? TRUE : FALSE) : fallback;
          }

          static guint validated_interval(const char *value, guint fallback)
          {
              int64_t parsed = 0;
              if (!infiltratr_parse_i64_range(value, 10U, 0, INT64_MAX, &parsed) ||
                  (parsed != 500 && parsed != 1000 && parsed != 2000 && parsed != 5000))
                  return fallback;
              return (guint)parsed;
          }

          static gint validated_integer(const char *value, gint minimum, gint maximum,
                                        gint fallback)
          {
              int64_t parsed = 0;
              if (!infiltratr_parse_i64_range(value, 10U, minimum, maximum, &parsed))
                  return fallback;
              return (gint)parsed;
          }

          static double validated_double(const char *value, double minimum,
                                         double maximum, double fallback)
          {
              double parsed = 0.0;
              return infiltratr_parse_double_range(value, minimum, maximum, &parsed)
                  ? parsed : fallback;
          }

          '''
          text = text[:start] + replacements + text[end:]
          old_parse = '''        line[strcspn(line, "\\r\\n")] = '\\0';
                  char *equals = strchr(line, '=');
                  if (!equals) continue;
                  *equals++ = '\\0';
          '''
          if old_parse not in text:
              raise SystemExit('preferences line parser not found')
          new_parse = '''        char *key = NULL;
                  char *value = NULL;
                  if (infiltratr_config_parse_line(line, &key, &value) !=
                      INFILTRATR_CONFIG_LINE_ENTRY)
                      continue;
          '''
          text = text.replace(old_parse, new_parse, 1)
          loop_start = text.index('    while (fgets(line, sizeof(line), file)) {')
          loop_end = text.index('    fclose(file);', loop_start)
          block = text[loop_start:loop_end]
          block = block.replace('strcmp(line,', 'strcmp(key,')
          block = block.replace('strncmp(line,', 'strncmp(key,')
          block = block.replace('line[12]', 'key[12]').replace('line[13]', 'key[13]')
          block = block.replace('equals', 'value')
          text = text[:loop_start] + block + text[loop_end:]
          pref.write_text(text)

          refresh = Path('src/refresh_policy.c')
          text = refresh.read_text()
          text = text.replace('#include <math.h>', '#include <infiltratr/timing.h>')
          old_body = '''    return !isfinite(now) || !isfinite(last) || !isfinite(interval) ||
                     last <= 0.0 || interval <= 0.0 || now < last ||
                     now - last >= interval;
          '''
          if old_body not in text:
              raise SystemExit('refresh policy body not found')
          text = text.replace(old_body, '    return infiltratr_interval_due(now, last, interval);\n')
          refresh.write_text(text)

          # Move the one cross-performance declaration out of the now-opaque app.h.
          perf_internal = Path('src/performance_internal.h')
          perf_internal.write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later
          /**
           * @file performance_internal.h
           * @brief Private interfaces shared by Performance presentation modules.
           * @author Shannon Smith
           * @copyright Copyright (c) 2026 Shannon Smith
           * @license GPL-3.0-or-later
           */
          #ifndef LINUX_SYSTEM_MONITOR_PERFORMANCE_INTERNAL_H
          #define LINUX_SYSTEM_MONITOR_PERFORMANCE_INTERNAL_H

          #include "app_internal.h"

          /** Rebuild one GPU graph selector from current backend capabilities. */
          void lsm_performance_populate_gpu_metric_selector(
              LsmGpuGraphSlot *slot, const LsmGpuInfo *gpu, LsmGpuMetric preferred);

          #endif
          ''')
          for name in ('performance.c', 'performance_pages_core.c',
                       'performance_pages_devices.c', 'performance_present.c'):
              p = Path('src') / name
              t = p.read_text()
              if 'lsm_performance_populate_gpu_metric_selector' in t and \
                 '#include "performance_internal.h"' not in t:
                  match = re.search(r'^#include "[^"]+"\n', t, re.MULTILINE)
                  t = t[:match.end()] + '#include "performance_internal.h"\n' + t[match.end():]
                  p.write_text(t)

          sources = Path('support/sources.txt')
          text = sources.read_text()
          text = text.replace('app.c\n', 'app.c\napp_runtime.c\napp_shell.c\n', 1)
          sources.write_text(text)

          Path('support/VERSION').write_text('1.13.14\n')

          # Synchronise the pinned Common 1.7.0 component in both build systems.
          p = Path('CMakeLists.txt')
          text = p.read_text()
          text = text.replace('set(INFILTRATR_COMMON_TAG "v1.6.0")',
                              'set(INFILTRATR_COMMON_TAG "v1.7.0")')
          text = text.replace('set(INFILTRATR_COMMON_EXPECTED_VERSION "1.6.0")',
                              'set(INFILTRATR_COMMON_EXPECTED_VERSION "1.7.0")')
          text = text.replace('set(INFILTRATR_COMMON_EXPECTED_COMMIT "7dc1195efd3f066e84c57520b44b2aa448847b90")',
                              'set(INFILTRATR_COMMON_EXPECTED_COMMIT "f7cc14f074d30f0374ea8b05cd4bd507ecc40427")')
          text = text.replace('    "${INFILTRATR_COMMON_DIR}/src/arithmetic.c"\n    "${INFILTRATR_COMMON_DIR}/src/format.c"',
                              '    "${INFILTRATR_COMMON_DIR}/src/arithmetic.c"\n    "${INFILTRATR_COMMON_DIR}/src/config.c"\n    "${INFILTRATR_COMMON_DIR}/src/timing.c"\n    "${INFILTRATR_COMMON_DIR}/src/format.c"')
          p.write_text(text)

          p = Path('Makefile')
          text = p.read_text()
          text = text.replace('INFILTRATR_COMMON_TAG := v1.6.0', 'INFILTRATR_COMMON_TAG := v1.7.0')
          text = text.replace('INFILTRATR_COMMON_COMMIT := 7dc1195efd3f066e84c57520b44b2aa448847b90',
                              'INFILTRATR_COMMON_COMMIT := f7cc14f074d30f0374ea8b05cd4bd507ecc40427')
          text = text.replace('INFILTRATR_COMMON_VERSION := 1.6.0', 'INFILTRATR_COMMON_VERSION := 1.7.0')
          text = text.replace('\t$(INFILTRATR_COMMON_DIR)/src/arithmetic.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/format.c',
                              '\t$(INFILTRATR_COMMON_DIR)/src/arithmetic.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/config.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/timing.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/format.c')
          text = text.replace('\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/arithmetic.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/format.h',
                              '\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/arithmetic.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/config.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/timing.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/format.h')
          text = text.replace('\t$(BUILD_DIR)/infiltratr-common/arithmetic.o \\\n\t$(BUILD_DIR)/infiltratr-common/format.o',
                              '\t$(BUILD_DIR)/infiltratr-common/arithmetic.o \\\n\t$(BUILD_DIR)/infiltratr-common/config.o \\\n\t$(BUILD_DIR)/infiltratr-common/timing.o \\\n\t$(BUILD_DIR)/infiltratr-common/format.o')
          p.write_text(text)

          for filename in ('README.md', 'support/tests/project_info_smoke.c'):
              p = Path(filename)
              t = p.read_text().replace('1.6.0', '1.7.0')
              p.write_text(t)
          PY

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor application boundaries and adopt Common 1.7.0"
          git push origin HEAD:refactor/app-boundaries-1.13.14

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libgtk-3-dev pkg-config zip

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: make check

      - name: Verify with sanitizers
        run: make sanitizer-check

      - name: Verify release packaging without publishing
        run: make -j2 release
