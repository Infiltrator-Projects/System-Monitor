# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reject destructive repository automation
        shell: bash
        run: |
          set -euo pipefail
          force_push='git[[:space:]]+push[^#]*--'force
          delete_ref='git[[:space:]]+push[^#]*--'delete
          release_delete='gh[[:space:]]+relea''se[[:space:]]+dele''te([[:space:]-]|$)'
          api_delete='gh[[:space:]]+api[^#]*(--method|-X)[[:space:]]+DEL''ETE'
          http_delete='(curl|wget)[^#]*-X[[:space:]]+DEL''ETE'
          if grep -REn --include='*.yml' --include='*.yaml' \
            -e "$force_push" -e "$delete_ref" -e "$release_delete" \
            -e "$api_delete" -e "$http_delete" .github/workflows; then
            echo "Destructive repository automation is forbidden." >&2
            exit 1
          fi

      - name: Enforce immutable version identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          fi
          tag_commit=$(git rev-list -n 1 "v${version}" 2>/dev/null || true)
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'Version %s is already assigned to commit %s.\n' \
              "$version" "$tag_commit" >&2
            printf 'Increment support/VERSION before changing the source tree.\n' >&2
            exit 1
          fi
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libgtk-3-dev pkg-config zip

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: make check

      - name: Verify with sanitizers
        run: make sanitizer-check

      - name: Verify release packaging without publishing
        run: make -j2 release
