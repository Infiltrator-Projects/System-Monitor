# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out source branch and Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/app-boundaries-1.13.14
          fetch-depth: 0
          submodules: recursive

      - name: Apply forensic finish
        run: |
          python3 .github/forensic_finish.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app_menu.c')
          path.write_text(path.read_text().rstrip() + '\n')
          PY

      - name: Verify source diff
        run: |
          git diff --check
          test -f src/app_menu.c
          test -f src/app_menu.h
          ! grep -F '#include "app_internal.h"' src/application_catalog.c
          ! grep -F '#include "app_internal.h"' src/performance_present.h

      - name: Verify with CMake and CTest
        run: |
          rm -rf build-cmake
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: make check

      - name: Verify with sanitizers
        run: make sanitizer-check

      - name: Verify release packaging without publishing
        run: make -j2 release

      - name: Commit verified source fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt Makefile support/sources.txt \
            src/app.c src/app_internal.h src/app_menu.c src/app_menu.h \
            src/app_shell.c src/app_shell.h src/application_catalog.c \
            src/performance_present.h support/tests/application_catalog_smoke.c
          git diff --cached --check
          git commit -m 'Finish application boundary refactor'
          git push origin HEAD:refactor/app-boundaries-1.13.14
