# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out committed source and Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/app-boundaries-1.13.14
          fetch-depth: 0
          submodules: recursive

      - name: Verify committed architecture boundaries
        run: |
          git diff --check
          test -f src/app_menu.c
          test -f src/app_menu.h
          ! grep -F '#include "app_internal.h"' src/application_catalog.c
          ! grep -F '#include "app_internal.h"' src/performance_present.h
          grep -F 'return calloc(1U, sizeof(LsmApp));' src/app.c
          grep -F 'checkout --detach "${INFILTRATR_COMMON_EXPECTED_COMMIT}"' CMakeLists.txt

      - name: Verify with CMake and CTest
        run: |
          rm -rf build-cmake
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: make check

      - name: Verify with sanitizers
        run: make sanitizer-check

      - name: Verify release packaging without publishing
        run: make -j2 release
