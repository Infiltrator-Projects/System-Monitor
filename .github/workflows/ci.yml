# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 30
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reject destructive repository automation
        shell: bash
        run: |
          set -euo pipefail
          force_push='git[[:space:]]+push[^#]*--'force
          delete_ref='git[[:space:]]+push[^#]*--'delete
          release_delete='gh[[:space:]]+relea''se[[:space:]]+dele''te([[:space:]-]|$)'
          api_delete='gh[[:space:]]+api[^#]*(--method|-X)[[:space:]]+DEL''ETE'
          http_delete='(curl|wget)[^#]*-X[[:space:]]+DEL''ETE'
          if grep -REn --include='*.yml' --include='*.yaml' \
            -e "$force_push" -e "$delete_ref" -e "$release_delete" \
            -e "$api_delete" -e "$http_delete" .github/workflows; then
            echo "Destructive repository automation is forbidden." >&2
            exit 1
          fi

      - name: Enforce main-only automatic immutable publishing
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/release.yml
          grep -Fq '  workflow_run:' "$release"
          grep -Fq 'workflows: ["Verify"]' "$release"
          grep -Fq "startsWith(github.event.workflow_run.head_commit.message, 'Release ')" "$release"
          grep -Fq "github.event.workflow_run.head_branch == 'main'" "$release"
          grep -Fq 'published releases are immutable' "$release"
          if grep -Eq '^  workflow_dispatch:|^  pull_request:|^  schedule:' "$release"; then
            echo "Release publication must be automatic from tested main only." >&2
            exit 1
          fi
          if grep -Eq '^  pull_request:|^  merge_group:' .github/workflows/ci.yml; then
            echo "System Monitor CI must use main only." >&2
            exit 1
          fi

      - name: Validate source version and immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid source version: %s\n' "$version" >&2
            exit 1
          fi

          readme_version=$(sed -nE \
            's/^\*\*Current source version:\*\* ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' \
            README.md)
          if [[ "$readme_version" != "$version" ]]; then
            printf 'README source version %s does not match support/VERSION %s.\n' \
              "${readme_version:-missing}" "$version" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "v${version}")
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]]; then
              printf 'Source version %s is already published at %s; advance support/VERSION before changing main.\n' \
                "$version" "$tag_commit" >&2
              exit 1
            fi
          fi

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-multilib git libc6-dev-i386 \
            libbluetooth-dev libcap2-bin libgtk-3-dev pkg-config

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: REQUIRE_I386=1 make check

      - name: Verify with sanitizers
        run: make sanitizer-check

      - name: Verify release packaging without publishing
        shell: bash
        run: |
          set -euo pipefail
          make -j2 deb native-installer
          version=$(tr -d '[:space:]' < support/VERSION)
          deb="linux-system-monitor_${version}_amd64.deb"
          test -f "$deb"

          expected_members=$(printf 'debian-binary\ncontrol.tar.xz\ndata.tar.xz')
          actual_members=$(ar t "$deb")
          if [[ "$actual_members" != "$expected_members" ]]; then
            printf 'Debian archive members are not the compatibility-safe XZ set.\n' >&2
            printf 'Found:\n%s\n' "$actual_members" >&2
            exit 1
          fi

          contents=$(dpkg-deb --contents "$deb")
          if grep -q '1970-01-01' <<<"$contents"; then
            printf 'Debian package contains Unix-epoch timestamps.\n' >&2
            exit 1
          fi

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          changelog="$tmp/root/usr/share/doc/linux-system-monitor/changelog.gz"
          gzip -t "$changelog"
          first_line=$(gzip -cd "$changelog" | sed -n '1p')
          expected_line="linux-system-monitor (${version}) unstable; urgency=medium"
          if [[ "$first_line" != "$expected_line" ]]; then
            printf 'Installed changelog is not valid Debian changelog syntax.\n' >&2
            exit 1
          fi
          gzip -cd "$changelog" > "$tmp/debian-changelog"
          dpkg-parsechangelog -l"$tmp/debian-changelog" >/dev/null

  local-native:
    name: Local Linux / native verification
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 30
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install native build dependencies
        if: runner.environment == 'github-hosted'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-multilib git libc6-dev-i386 \
            libbluetooth-dev libcap2-bin libgtk-3-dev pkg-config

      - name: Validate source version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < support/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-local -DCMAKE_BUILD_TYPE=Release
          cmake --build build-local --parallel
          ctest --test-dir build-local --output-on-failure --parallel

      - name: Verify native Make checks
        run: make check

      - name: Verify with sanitizers
        run: make sanitizer-check

      - name: Build release packages without publishing
        run: make -j2 deb native-installer
