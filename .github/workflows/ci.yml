# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-v9-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify source
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Ensure Git is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v git >/dev/null 2>&1; then
            git --version
            exit 0
          fi
          command -v apt-get >/dev/null
          command -v dpkg-deb >/dev/null
          git_root="$RUNNER_TEMP/system-monitor-git"
          package_dir="$RUNNER_TEMP/system-monitor-git-package"
          rm -rf "$git_root" "$package_dir"
          mkdir -p "$git_root" "$package_dir"
          (
            cd "$package_dir"
            apt-get download git
            package="$(find . -maxdepth 1 -type f -name 'git_*.deb' -print -quit)"
            test -n "$package"
            dpkg-deb -x "$package" "$git_root"
          )
          test -x "$git_root/usr/bin/git"
          test -x "$git_root/usr/lib/git-core/git-submodule"
          echo "$git_root/usr/bin" >> "$GITHUB_PATH"
          echo "GIT_EXEC_PATH=$git_root/usr/lib/git-core" >> "$GITHUB_ENV"

      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reject destructive release automation
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --include='*.yml' --include='*.yaml' \
            -e 'git[[:space:]]+push[^#]*--force' \
            -e 'git[[:space:]]+push[^#]*--delete' \
            -e 'git[[:space:]]+push[^#]*:refs/tags/' \
            -e 'gh[[:space:]]+release[[:space:]]+delete([[:space:]-]|$)' \
            -e 'gh[[:space:]]+api[^#]*(--method|-X)[[:space:]]+DELETE' \
            .github/workflows; then
            echo "Destructive repository automation is forbidden." >&2
            exit 1
          fi

      - name: Validate source version and immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          readme_version=$(sed -nE \
            's/^\*\*Current source version:\*\* ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' \
            README.md)
          test "$readme_version" = "$version"

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "v${version}")
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]] &&
               ! git diff --quiet "$tag_commit" HEAD -- . ':!.github/workflows'; then
              printf 'Source version %s is already published at %s; advance support/VERSION before changing product source.\n' \
                "$version" "$tag_commit" >&2
              exit 1
            fi
          fi

      - name: Verify self-hosted build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in cmake doxygen gcc g++ git make pkg-config xauth Xvfb xvfb-run; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "Self-hosted runner is missing $command_name." >&2
              exit 1
            }
          done
          pkg-config --exists gtk+-3.0
          probe="$(mktemp --suffix=.c)"
          printf 'int main(void){return 0;}\n' > "$probe"
          gcc -m32 "$probe" -o "$RUNNER_TEMP/system-monitor-m32-probe"

      - name: Verify CMake application build
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --target system-monitor --parallel 2

      - name: Verify GTK Overview navigation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-overview \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DLSM_TEST_PAGE_INDEX=8"
          cmake --build build-overview --target system-monitor --parallel 2
          status=0
          timeout 5s xvfb-run -a ./build-overview/system-monitor || status=$?
          test "$status" -eq 124

      - name: Verify GTK Overview geometry at 1024x768
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-overview-geometry \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DLSM_TEST_PAGE_INDEX=8 -DLSM_TEST_OVERVIEW_GEOMETRY=1"
          cmake --build build-overview-geometry --target system-monitor --parallel 2
          timeout 10s xvfb-run -a -s "-screen 0 1024x768x24" \
            ./build-overview-geometry/system-monitor

      - name: Verify GTK Memory resource navigation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-memory-nav \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-DLSM_TEST_PERFORMANCE_RESOURCE=1 -fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-memory-nav --target system-monitor --parallel 2
          status=0
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=0 \
            timeout 5s xvfb-run -a ./build-memory-nav/system-monitor || status=$?
          test "$status" -eq 124

      - name: Run canonical verification suite
        run: |
          ulimit -s 65536
          REQUIRE_I386=1 make check

      - name: Verify with sanitizers
        run: |
          ulimit -s 65536
          make sanitizer-check

  linux-release:
    name: Build and qualify Linux release artifacts
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set reproducible release timestamp
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct HEAD)
          [[ "$epoch" =~ ^[0-9]+$ ]]
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"

      - name: Install release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake doxygen git libgtk-3-dev pkg-config xauth xvfb

      - name: Build release artifacts once
        run: make -j2 release

      - name: Verify Debian compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          deb="infiltrator-system-monitor_${version}_amd64.deb"
          installer="infiltrator-system-monitor-${version}-native-installer.run"
          test -f "$deb"
          test -x "$installer"
          test "$(dpkg-deb -f "$deb" Package)" = "infiltrator-system-monitor"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-3-0(t64)?' <<<"$dependencies"
          ! grep -Eq 'fontconfig|libcap2-bin|libbluetooth' <<<"$dependencies"
          expected_members=$(printf 'debian-binary\ncontrol.tar.xz\ndata.tar.xz')
          test "$(ar t "$deb")" = "$expected_members"
          ! dpkg-deb --contents "$deb" | grep -q '1970-01-01'
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          dpkg-deb -e "$deb" "$tmp/control"
          grep -Fq '/usr/bin/system-monitor --install-capability' "$tmp/control/postinst"
          ! grep -Eq 'setcap|fc-cache|gtk-update-icon-cache|update-desktop-database' "$tmp/control/postinst"
          font_root="$tmp/root/usr/share/fonts/truetype/infiltrator-system-monitor"
          for face in mb_corpo_a_cond_regular.ttf mb_corpo_s_regular.ttf mb_corpo_s_bold.ttf; do
            test -f "$font_root/$face"
            cmp "build/fonts/$face" "$font_root/$face"
          done
          changelog="$tmp/root/usr/share/doc/infiltrator-system-monitor/changelog.gz"
          gzip -t "$changelog"
          first_line=$(gzip -cd "$changelog" | sed -n '1p')
          test "$first_line" = "infiltrator-system-monitor (${version}) unstable; urgency=medium"
          ./"$installer" --help >/dev/null

      - name: Upload exact Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: system-monitor-linux-release
          path: |
            infiltrator-system-monitor_*.deb
            infiltrator-system-monitor-*-native-installer.run
            build/fonts/*.ttf
          if-no-files-found: error
          retention-days: 14

  clean-installer:
    name: Qualify exact native installer on a clean host
    needs: linux-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install clean-host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake doxygen git libgtk-3-dev pkg-config xauth xvfb
      - name: Download exact Linux release candidate
        uses: actions/download-artifact@v4
        with:
          name: system-monitor-linux-release
      - name: Qualify aggressive PGO installer end to end
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          version=$(tr -d '[:space:]' < support/VERSION)
          mapfile -t installers < <(find . -maxdepth 1 -type f -name '*.run' -printf '%f\n' | sort)
          test "${#installers[@]}" -eq 1
          installer="${installers[0]}"
          chmod +x "$installer"
          sudo ./"$installer" --profile aggressive --system-package-mode
          test "$(dpkg-query -W -f='${Status}' infiltrator-system-monitor)" = "install ok installed"
          test "$(dpkg-query -W -f='${Version}' infiltrator-system-monitor)" = "$version"
          for face in mb_corpo_a_cond_regular.ttf mb_corpo_s_regular.ttf mb_corpo_s_bold.ttf; do
            cmp "build/fonts/$face" "/usr/share/fonts/truetype/infiltrator-system-monitor/$face"
          done
          pgo_log=$(mktemp)
          ./"$installer" --profile aggressive --skip-tests 2>&1 | tee "$pgo_log"
          ! grep -Fq 'stringop-overread' "$pgo_log"
          test "$(dpkg-query -W -f='${Status}' infiltrator-system-monitor)" = "install ok installed"
          test "$(dpkg-query -W -f='${Version}' infiltrator-system-monitor)" = "$version"

  windows-release:
    name: Build and qualify exact Windows release artifact
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Build and launch native Windows GUI
        shell: pwsh
        run: '& ./support/windows/build-release.ps1'
      - name: Upload exact Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: system-monitor-windows-release
          path: system-monitor-*-windows.exe
          if-no-files-found: error
          retention-days: 14

  release-assets:
    name: Seal exact qualified release assets
    needs: [linux-release, clean-installer, windows-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download exact Linux candidate
        uses: actions/download-artifact@v4
        with:
          name: system-monitor-linux-release
          path: candidate-linux
      - name: Download exact Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: system-monitor-windows-release
          path: candidate-windows
      - name: Seal release bundle
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          mapfile -t debs < <(find candidate-linux -maxdepth 1 -type f -name '*.deb' -printf '%f\n' | sort)
          mapfile -t installers < <(find candidate-linux -maxdepth 1 -type f -name '*.run' -printf '%f\n' | sort)
          mapfile -t windows_apps < <(find candidate-windows -maxdepth 1 -type f -name '*.exe' -printf '%f\n' | sort)
          test "${#debs[@]}" -eq 1
          test "${#installers[@]}" -eq 1
          test "${#windows_apps[@]}" -eq 1
          deb="${debs[0]}"
          installer="${installers[0]}"
          windows_app="${windows_apps[0]}"

          mkdir -p release
          cp "candidate-linux/$deb" "release/$deb"
          cp "candidate-linux/$installer" "release/$installer"
          cp "candidate-windows/$windows_app" "release/$windows_app"
          chmod +x "release/$installer"
          test "$(dpkg-deb -f "release/$deb" Package)" = "infiltrator-system-monitor"
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          "release/$installer" --help >/dev/null
          (
            cd release
            sha256sum "$deb" "$installer" "$windows_app" > RELEASE_SHA256SUMS.txt
            printf '%s\n' "$GITHUB_SHA" > RELEASE_SOURCE_SHA
            printf '%s\n' "$version" > RELEASE_VERSION
          )
      - name: Upload sealed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: system-monitor-release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14
