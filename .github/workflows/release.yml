# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-multilib git jq libc6-dev-i386 \
            libgtk-3-dev pkg-config unzip zip

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          # Exact equality with origin/main is deliberately stronger than the
          # former git merge-base --is-ancestor release provenance gate.
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [[ "$head_commit" != "$main_commit" ]]; then
            printf 'Release checkout %s is not current main %s.\n' \
              "$head_commit" "$main_commit" >&2
            exit 1
          fi

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: REQUIRE_I386=1 make check

      - name: Build release packages
        run: make -j2 release

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$main_commit"

          version=$(tr -d '[:space:]' < support/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          fi
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Release tag %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi

          deb="linux-system-monitor_${version}_amd64.deb"
          installer="linux-system-monitor-${version}-native-installer.run"
          source="Linux-System-Monitor-${version}-source.zip"
          test -f "$deb"
          test -x "$installer"
          test -f "$source"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          ./"$installer" --help >/dev/null
          test "$(unzip -p "$source" '*/src/infiltratr-common/VERSION' | tr -d '[:space:]')" = "1.11.0"

          notes=$(git log -1 --format=%b "$head_commit")
          if [[ -z "$notes" ]]; then
            notes="Verified Linux System Monitor ${version} release."
          fi

          git tag "$tag" "$head_commit"
          git push origin "$tag"

          gh release create "$tag" "$deb" "$installer" "$source" \
            --verify-tag \
            --target "$head_commit" \
            --title "Linux System Monitor $version" \
            --notes "$notes" \
            --latest

          expected_assets=$(printf '%s\n%s\n%s\n' "$deb" "$installer" "$source" | sort)
          published_assets=$(gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi

          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          for asset in "$deb" "$installer" "$source"; do
            local_size=$(stat -c '%s' "$asset")
            remote_size=$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .size][0] // 0' \
              <<<"$release_json")
            if [[ "$remote_size" != "$local_size" ]]; then
              printf 'Release asset %s has size %s; expected %s.\n' \
                "$asset" "$remote_size" "$local_size" >&2
              exit 1
            fi

            local_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            remote_digest=$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .digest][0] // ""' \
              <<<"$release_json")
            if [[ -n "$remote_digest" && "$remote_digest" != "$local_digest" ]]; then
              printf 'Release asset %s digest mismatch.\n' "$asset" >&2
              exit 1
            fi
          done

          published_tag=$(gh release view "$tag" --json tagName --jq .tagName)
          test "$published_tag" = "$tag"
