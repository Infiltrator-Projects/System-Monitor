# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

# Verify is the sole producer and qualifier of release binaries.
# This workflow only proves that the successful Verify run belongs to the exact
# current main Release commit, verifies its sealed artifact manifest, and
# publishes those exact bytes. Published releases are immutable.
# Central APT publication is owned independently by Infiltrator-Repository.

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify exact current main and Release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$EXPECTED_SHA"
          current_main=$(git rev-parse origin/main)
          if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
            printf 'Refusing to publish stale tested commit %s; current main is %s.\n' \
              "$EXPECTED_SHA" "$current_main" >&2
            exit 1
          fi
          version=$(tr -d '[:space:]' < support/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi

      - name: Download exact qualified release bundle
        uses: actions/download-artifact@v4
        with:
          name: system-monitor-release-assets
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify sealed artifact identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          deb="infiltrator-system-monitor_${version}_amd64.deb"
          installer="infiltrator-system-monitor-${version}-native-installer.run"
          windows_app="system-monitor-${version}-windows.exe"

          test "$(cat release/RELEASE_SOURCE_SHA)" = "$EXPECTED_SHA"
          test "$(cat release/RELEASE_VERSION)" = "$version"
          (
            cd release
            sha256sum -c RELEASE_SHA256SUMS.txt
          )

          test -f "release/$deb"
          test -f "release/$installer"
          test -f "release/$windows_app"
          test "$(dpkg-deb -f "release/$deb" Package)" = "infiltrator-system-monitor"
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          chmod +x "release/$installer"
          "release/$installer" --help >/dev/null

          expected_manifest=$(printf '%s\n%s\n%s\n' "$deb" "$installer" "$windows_app" | sort)
          actual_manifest=$(awk '{print $2}' release/RELEASE_SHA256SUMS.txt | sed 's#^\*##' | sort)
          if [[ "$actual_manifest" != "$expected_manifest" ]]; then
            echo 'Sealed release manifest has an unexpected asset set.' >&2
            exit 1
          fi

      - name: Publish or resume exact immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$EXPECTED_SHA"

          version=$(tr -d '[:space:]' < support/VERSION)
          tag="v${version}"
          deb="infiltrator-system-monitor_${version}_amd64.deb"
          installer="infiltrator-system-monitor-${version}-native-installer.run"
          windows_app="system-monitor-${version}-windows.exe"
          deb_path="release/$deb"
          installer_path="release/$installer"
          windows_path="release/$windows_app"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$head_commit" ]]; then
              printf 'Release tag %s points to %s instead of verified commit %s.\n' \
                "$tag" "$tag_commit" "$head_commit" >&2
              exit 1
            fi
          else
            git tag "$tag" "$head_commit"
            git push origin "$tag"
          fi

          expected_assets=$(printf '%s\n%s\n%s\n' "$deb" "$installer" "$windows_app" | sort)
          if gh release view "$tag" >/dev/null 2>&1; then
            published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
            if [[ "$published_assets" != "$expected_assets" ]]; then
              printf 'Release %s has an unexpected asset set; published releases are immutable.\n' "$tag" >&2
              exit 1
            fi
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            gh release download "$tag" --dir "$tmp"
            cmp -s "$deb_path" "$tmp/$deb" || { echo 'Published Debian asset differs from the qualified artifact.' >&2; exit 1; }
            cmp -s "$installer_path" "$tmp/$installer" || { echo 'Published native installer differs from the qualified artifact.' >&2; exit 1; }
            cmp -s "$windows_path" "$tmp/$windows_app" || { echo 'Published Windows GUI differs from the qualified artifact.' >&2; exit 1; }
            echo "Exact immutable release $tag already exists; verified qualified bytes."
          else
            notes=$(git log -1 --format=%b "$head_commit")
            if [[ -z "$notes" ]]; then
              notes="Verified System Monitor ${version} release."
            fi
            gh release create "$tag" "$deb_path" "$installer_path" "$windows_path" \
              --verify-tag \
              --target "$head_commit" \
              --title "System Monitor $version" \
              --notes "$notes" \
              --latest
          fi

          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$published_assets" = "$expected_assets"
