# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set reproducible release timestamp
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct "$EXPECTED_SHA")
          [[ "$epoch" =~ ^[0-9]+$ ]]
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-multilib git libc6-dev-i386 \
            libbluetooth-dev libcap2-bin libgtk-3-dev pkg-config

      - name: Verify exact current main and Release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"
          version=$(tr -d '[:space:]' < support/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: REQUIRE_I386=1 make check

      - name: Build release packages
        run: make -j2 deb native-installer

      - name: Verify Debian compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          deb="linux-system-monitor_${version}_amd64.deb"
          test -f "$deb"

          expected_members=$(printf 'debian-binary\ncontrol.tar.xz\ndata.tar.xz')
          actual_members=$(ar t "$deb")
          if [[ "$actual_members" != "$expected_members" ]]; then
            printf 'Debian archive members are not the compatibility-safe XZ set.\n' >&2
            printf 'Found:\n%s\n' "$actual_members" >&2
            exit 1
          fi

          contents=$(dpkg-deb --contents "$deb")
          if grep -q '1970-01-01' <<<"$contents"; then
            printf 'Debian package contains Unix-epoch timestamps.\n' >&2
            exit 1
          fi

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          changelog="$tmp/root/usr/share/doc/linux-system-monitor/changelog.gz"
          gzip -t "$changelog"
          first_line=$(gzip -cd "$changelog" | sed -n '1p')
          expected_line="linux-system-monitor (${version}) unstable; urgency=medium"
          if [[ "$first_line" != "$expected_line" ]]; then
            printf 'Installed changelog is not valid Debian changelog syntax.\n' >&2
            exit 1
          fi
          gzip -cd "$changelog" > "$tmp/debian-changelog"
          dpkg-parsechangelog -l"$tmp/debian-changelog" >/dev/null

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"

          version=$(tr -d '[:space:]' < support/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Release tag %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi

          deb="linux-system-monitor_${version}_amd64.deb"
          installer="linux-system-monitor-${version}-native-installer.run"
          test -f "$deb"
          test -x "$installer"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          ./"$installer" --help >/dev/null

          notes=$(git log -1 --format=%b "$head_commit")
          if [[ -z "$notes" ]]; then
            notes="Verified Linux System Monitor ${version} release."
          fi

          git tag "$tag" "$head_commit"
          git push origin "$tag"
          gh release create "$tag" "$deb" "$installer" \
            --verify-tag \
            --target "$head_commit" \
            --title "Linux System Monitor $version" \
            --notes "$notes" \
            --latest

          expected_assets=$(printf '%s\n%s\n' "$deb" "$installer" | sort)
          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
            exit 1
          fi

      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_ID: system-monitor
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"

          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository's five-minute safety refresh."
            fi
          else
            echo "::warning::Immediate APT dispatch token is unavailable; waiting for the repository's five-minute safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          echo "::error::GitHub release was published, but the central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
