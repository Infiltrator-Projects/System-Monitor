# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - support/VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git jq libgtk-3-dev pkg-config zip

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: make check

      - name: Build release packages
        run: make -j2 release

      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < support/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          fi

          tag="v${version}"
          deb="linux-system-monitor_${version}_amd64.deb"
          installer="linux-system-monitor-${version}-native-installer.run"

          test -f "$deb"
          test -x "$installer"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          ./"$installer" --help >/dev/null

          notes=$(git log -1 --format=%b -- support/VERSION)
          if [[ -z "$notes" ]]; then
            notes="Verified Linux System Monitor ${version} release."
          fi

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Releases may only be published from main, not %s.\n' \
              "$GITHUB_REF" >&2
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "$tag" 2>/dev/null || true)
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'Tag %s points to %s, not %s.\n' \
              "$tag" "$tag_commit" "$GITHUB_SHA" >&2
            exit 1
          fi

          release_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
            if [[ -z "$tag_commit" ]]; then
              printf 'Release %s exists without a fetched tag.\n' "$tag" >&2
              exit 1
            fi
          elif [[ -n "$tag_commit" ]]; then
            gh release create "$tag" \
              --verify-tag \
              --title "Linux System Monitor ${version}" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Linux System Monitor ${version}" \
              --notes "$notes" \
              --latest
          fi

          if [[ "$release_exists" == false ]]; then
            gh release upload "$tag" "$deb" "$installer"
          fi

          expected_assets=$(printf '%s\n%s\n' "$deb" "$installer" | sort)
          published_assets=$(gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi

          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          for asset in "$deb" "$installer"; do
            local_size=$(stat -c '%s' "$asset")
            remote_size=$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .size][0] // 0' \
              <<<"$release_json")
            if [[ "$remote_size" != "$local_size" ]]; then
              printf 'Release asset %s has size %s; expected %s.\n' \
                "$asset" "$remote_size" "$local_size" >&2
              exit 1
            fi

            local_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            remote_digest=$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .digest][0] // ""' \
              <<<"$release_json")
            if [[ -n "$remote_digest" && "$remote_digest" != "$local_digest" ]]; then
              printf 'Release asset %s digest mismatch.\n' "$asset" >&2
              exit 1
            fi
          done

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          published_commit=$(git rev-list -n 1 "$tag")
          if [[ "$published_commit" != "$GITHUB_SHA" ]]; then
            printf 'Published tag %s points to %s, not %s.\n' \
              "$tag" "$published_commit" "$GITHUB_SHA" >&2
            exit 1
          fi

          if [[ "$release_exists" == true ]]; then
            printf 'Existing release %s is immutable and verified.\n' "$tag"
          fi
