# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

# Verify is the sole producer and qualifier of release binaries.
# make -j2 release is intentionally executed only by Verify's linux-release
# producer job; this publisher never rebuilds release binaries.
# This workflow only proves that the successful Verify run belongs to the exact
# current main Release commit, verifies its sealed artifact manifest, and
# publishes those exact bytes. Published releases are immutable.
# Central APT publication is owned independently by Infiltrator-Repository.

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify exact current main and Release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$EXPECTED_SHA"
          current_main=$(git rev-parse origin/main)
          if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
            printf 'Refusing to publish stale tested commit %s; current main is %s.\n' \
              "$EXPECTED_SHA" "$current_main" >&2
            exit 1
          fi
          version=$(tr -d '[:space:]' < support/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi

      - name: Download exact qualified release bundle
        uses: actions/download-artifact@v4
        with:
          name: system-monitor-release-assets
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify sealed artifact identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)

          test "$(cat release/RELEASE_SOURCE_SHA)" = "$EXPECTED_SHA"
          test "$(cat release/RELEASE_VERSION)" = "$version"
          (
            cd release
            sha256sum -c RELEASE_SHA256SUMS.txt
          )

          mapfile -t assets < <(
            awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' \
              release/RELEASE_SHA256SUMS.txt
          )
          test "${#assets[@]}" -eq 3
          test "$(printf '%s\n' "${assets[@]}" | sort -u | wc -l)" -eq 3

          deb=
          installer=
          windows_app=
          for asset in "${assets[@]}"; do
            [[ "$asset" != */* ]]
            test -f "release/$asset"
            case "$asset" in
              *.deb)
                test -z "$deb"
                deb="$asset"
                ;;
              *.run)
                test -z "$installer"
                installer="$asset"
                ;;
              *.exe)
                test -z "$windows_app"
                windows_app="$asset"
                ;;
              *)
                printf 'Unexpected sealed release asset: %s\n' "$asset" >&2
                exit 1
                ;;
            esac
          done
          test -n "$deb"
          test -n "$installer"
          test -n "$windows_app"

          test "$(dpkg-deb -f "release/$deb" Package)" = "infiltrator-system-monitor"
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          chmod +x "release/$installer"
          "release/$installer" --help >/dev/null

      - name: Publish or resume exact immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$EXPECTED_SHA"

          version=$(tr -d '[:space:]' < support/VERSION)
          tag="v${version}"

          mapfile -t assets < <(
            awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' \
              release/RELEASE_SHA256SUMS.txt
          )
          test "${#assets[@]}" -eq 3
          asset_paths=()
          for asset in "${assets[@]}"; do
            test -f "release/$asset"
            asset_paths+=("release/$asset")
          done
          expected_assets=$(printf '%s\n' "${assets[@]}" | sort)

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$head_commit" ]]; then
              printf 'Release tag %s points to %s instead of verified commit %s.\n' \
                "$tag" "$tag_commit" "$head_commit" >&2
              exit 1
            fi
          else
            git tag "$tag" "$head_commit"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
            if [[ "$published_assets" != "$expected_assets" ]]; then
              printf 'Release %s has an unexpected asset set; published releases are immutable.\n' "$tag" >&2
              exit 1
            fi
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            gh release download "$tag" --dir "$tmp"
            for asset in "${assets[@]}"; do
              cmp -s "release/$asset" "$tmp/$asset" || {
                printf 'Published asset %s differs from the qualified artifact.\n' "$asset" >&2
                exit 1
              }
            done
            echo "Exact immutable release $tag already exists; verified qualified bytes."
          else
            notes=$(git log -1 --format=%b "$head_commit")
            if [[ -z "$notes" ]]; then
              notes="Verified System Monitor ${version} release."
            fi
            gh release create "$tag" "${asset_paths[@]}" \
              --verify-tag \
              --target "$head_commit" \
              --title "System Monitor $version" \
              --notes "$notes" \
              --latest
          fi

          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$published_assets" = "$expected_assets"
