# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-multilib git jq libc6-dev-i386 \
            libgtk-3-dev pkg-config unzip zip

      - name: Verify with CMake and CTest
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel 2
          ctest --test-dir build-cmake --output-on-failure --parallel 2

      - name: Verify with Make
        run: REQUIRE_I386=1 make check

      - name: Build release packages
        run: make -j2 release

      - name: Publish or verify the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < support/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$DISPATCH_TAG"
          fi
          expected_tag="v${version}"
          if [[ "$tag" != "$expected_tag" ]]; then
            printf 'Tag %s does not match source version %s.\n' \
              "$tag" "$version" >&2
            exit 1
          fi

          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_commit=$(git rev-list -n 1 "$tag")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$head_commit" ]]; then
            printf 'Tag %s points to %s, not checked-out commit %s.\n' \
              "$tag" "$tag_commit" "$head_commit" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            printf 'Tag %s is not a commit on main.\n' "$tag" >&2
            exit 1
          fi

          deb="linux-system-monitor_${version}_amd64.deb"
          installer="linux-system-monitor-${version}-native-installer.run"
          source="Linux-System-Monitor-${version}-source.zip"
          test -f "$deb"
          test -x "$installer"
          test -f "$source"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          ./"$installer" --help >/dev/null
          test "$(unzip -p "$source" '*/src/infiltratr-common/VERSION' | tr -d '[:space:]')" = "1.11.0"

          notes=$(git log -1 --format=%b "$tag")
          if [[ -z "$notes" ]]; then
            notes="Verified Linux System Monitor ${version} release."
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Existing release %s is immutable; verifying only.\n' "$tag"
          else
            gh release create "$tag" "$deb" "$installer" "$source" \
              --verify-tag \
              --title "Linux System Monitor $version" \
              --notes "$notes" \
              --latest
          fi

          expected_assets=$(printf '%s\n%s\n%s\n' "$deb" "$installer" "$source" | sort)
          published_assets=$(gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi

          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          for asset in "$deb" "$installer" "$source"; do
            local_size=$(stat -c '%s' "$asset")
            remote_size=$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .size][0] // 0' \
              <<<"$release_json")
            if [[ "$remote_size" != "$local_size" ]]; then
              printf 'Release asset %s has size %s; expected %s.\n' \
                "$asset" "$remote_size" "$local_size" >&2
              exit 1
            fi

            local_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            remote_digest=$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .digest][0] // ""' \
              <<<"$release_json")
            if [[ -n "$remote_digest" && "$remote_digest" != "$local_digest" ]]; then
              printf 'Release asset %s digest mismatch.\n' "$asset" >&2
              exit 1
            fi
          done

          published_tag=$(gh release view "$tag" --json tagName --jq .tagName)
          test "$published_tag" = "$tag"
