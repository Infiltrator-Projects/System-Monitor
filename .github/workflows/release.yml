# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

# Verify is the sole producer and qualifier of release binaries. Publication
# trusts the sealed bundle produced by that exact successful run: its source
# SHA, version and checksums are the release contract. This workflow never
# rebuilds product binaries and never reparses release identity from a second
# source checkout. Superseded verified runs and already-published versions are
# successful no-ops rather than spurious release failures. Keep this contract
# implementation-light so qualification and publication cannot drift together.
# Central APT publication remains owned independently by Infiltrator-Repository.

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download sealed qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: system-monitor-release-assets
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish or verify immutable release
        shell: bash
        run: |
          set -euo pipefail

          test "$(cat release/RELEASE_SOURCE_SHA)" = "$SOURCE_SHA"
          version=$(tr -d '[:space:]' < release/RELEASE_VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"

          (
            cd release
            sha256sum -c RELEASE_SHA256SUMS.txt
          )

          mapfile -t assets < <(
            awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' \
              release/RELEASE_SHA256SUMS.txt
          )
          test "${#assets[@]}" -eq 3
          test "$(printf '%s\n' "${assets[@]}" | sort -u | wc -l)" -eq 3

          deb=
          installer=
          windows_app=
          asset_paths=()
          for asset in "${assets[@]}"; do
            [[ "$asset" != */* ]]
            test -f "release/$asset"
            asset_paths+=("release/$asset")
            case "$asset" in
              *.deb)
                test -z "$deb"
                deb="$asset"
                ;;
              *.run)
                test -z "$installer"
                installer="$asset"
                ;;
              *.exe)
                test -z "$windows_app"
                windows_app="$asset"
                ;;
              *)
                printf 'Unexpected sealed release asset: %s\n' "$asset" >&2
                exit 1
                ;;
            esac
          done
          test -n "$deb"
          test -n "$installer"
          test -n "$windows_app"
          test "$(dpkg-deb -f "release/$deb" Package)" = "infiltrator-system-monitor"
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          chmod +x "release/$installer"
          "release/$installer" --help >/dev/null

          current_main=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$SOURCE_SHA" ]]; then
            printf 'Verified commit %s was superseded by main %s; nothing to publish.\n' \
              "$SOURCE_SHA" "$current_main"
            exit 0
          fi

          tag_exists=false
          if tag_identity=$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" \
              --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null); then
            read -r tag_type tag_sha <<<"$tag_identity"
            if [[ "$tag_type" != "commit" ]]; then
              printf 'Release tag %s is not a lightweight commit tag; refusing to reinterpret it.\n' \
                "$tag" >&2
              exit 1
            fi
            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              printf 'Version %s is already published at %s; verified main %s has no new release intent.\n' \
                "$version" "$tag_sha" "$SOURCE_SHA"
              exit 0
            fi
            tag_exists=true
          fi

          expected_assets=$(printf '%s\n' "${assets[@]}" | sort)
          if gh release view "$tag" >/dev/null 2>&1; then
            published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
            if [[ "$published_assets" != "$expected_assets" ]]; then
              printf 'Release %s has an unexpected asset set; published releases are immutable.\n' \
                "$tag" >&2
              exit 1
            fi
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            gh release download "$tag" --dir "$tmp"
            for asset in "${assets[@]}"; do
              cmp -s "release/$asset" "$tmp/$asset" || {
                printf 'Published asset %s differs from the qualified artifact.\n' "$asset" >&2
                exit 1
              }
            done
            echo "Exact immutable release $tag already exists; verified qualified bytes."
            exit 0
          fi

          if [[ "$tag_exists" == "true" ]]; then
            gh release create "$tag" "${asset_paths[@]}" \
              --verify-tag \
              --title "System Monitor $version" \
              --notes "Verified System Monitor ${version} release." \
              --latest
          else
            gh release create "$tag" "${asset_paths[@]}" \
              --target "$SOURCE_SHA" \
              --title "System Monitor $version" \
              --notes "Verified System Monitor ${version} release." \
              --latest
          fi

          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$published_assets" = "$expected_assets"
