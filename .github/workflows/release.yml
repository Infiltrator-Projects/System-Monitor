# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

# Verify is the sole producer and qualifier of release binaries. Publication
# trusts the sealed bundle produced by that exact successful run: its source
# SHA, version and checksums are the release contract. This workflow never
# rebuilds product binaries and never reparses release identity from a second
# source checkout. Superseded verified runs and already-published versions are
# successful no-ops rather than spurious release failures. New releases are
# staged as drafts, byte-verified remotely, and only then published; an
# interrupted draft remains mutable recovery state whose expected assets can
# be deterministically restored from the same sealed bundle. Central APT
# publication remains independently owned by Infiltrator-Repository.

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download sealed qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: system-monitor-release-assets
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish or verify immutable release
        shell: bash
        run: |
          set -euo pipefail

          test "$(cat release/RELEASE_SOURCE_SHA)" = "$SOURCE_SHA"
          version=$(tr -d '[:space:]' < release/RELEASE_VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"

          (
            cd release
            sha256sum -c RELEASE_SHA256SUMS.txt
          )

          mapfile -t sealed_assets < <(
            awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' \
              release/RELEASE_SHA256SUMS.txt | sort
          )
          expected_deb="infiltrator-system-monitor_${version}_amd64.deb"
          expected_installer="infiltrator-system-monitor-${version}-native-installer.run"
          expected_windows="system-monitor-${version}-windows.exe"
          mapfile -t expected_assets < <(
            printf '%s\n' "$expected_deb" "$expected_installer" "$expected_windows" | sort
          )
          test "${#sealed_assets[@]}" -eq 3
          test "$(printf '%s\n' "${sealed_assets[@]}" | sort -u | wc -l)" -eq 3
          if [[ "$(printf '%s\n' "${sealed_assets[@]}")" != \
                "$(printf '%s\n' "${expected_assets[@]}")" ]]; then
            printf 'Sealed release asset identity does not match version %s.\n' "$version" >&2
            printf 'Expected:\n%s\nSealed:\n%s\n' \
              "$(printf '  %s\n' "${expected_assets[@]}")" \
              "$(printf '  %s\n' "${sealed_assets[@]}")" >&2
            exit 1
          fi

          deb="$expected_deb"
          installer="$expected_installer"
          windows_app="$expected_windows"
          asset_paths=()
          for asset in "${expected_assets[@]}"; do
            [[ "$asset" != */* ]]
            test -f "release/$asset"
            asset_paths+=("release/$asset")
          done
          test "$(dpkg-deb -f "release/$deb" Package)" = "infiltrator-system-monitor"
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          chmod +x "release/$installer"
          "release/$installer" --help >/dev/null

          current_main=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$SOURCE_SHA" ]]; then
            printf 'Verified commit %s was superseded by main %s; nothing to publish.\n' \
              "$SOURCE_SHA" "$current_main"
            exit 0
          fi

          tag_exists=false
          tag_sha=
          if tag_identity=$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" \
              --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null); then
            read -r tag_type tag_sha <<<"$tag_identity"
            if [[ "$tag_type" != "commit" ]]; then
              printf 'Release tag %s is not a lightweight commit tag; refusing to reinterpret it.\n' \
                "$tag" >&2
              exit 1
            fi
            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              printf 'Version %s is already tagged at %s; verified main %s has no new release intent.\n' \
                "$version" "$tag_sha" "$SOURCE_SHA"
              exit 0
            fi
            tag_exists=true
          fi

          expected_remote_assets=$(printf '%s\n' "${expected_assets[@]}")
          verify_release_bytes() {
            local remote_assets tmp asset
            remote_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
            if [[ "$remote_assets" != "$expected_remote_assets" ]]; then
              printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
              return 1
            fi

            tmp=$(mktemp -d)
            if ! gh release download "$tag" --dir "$tmp"; then
              rm -rf "$tmp"
              return 1
            fi
            for asset in "${expected_assets[@]}"; do
              if ! cmp -s "release/$asset" "$tmp/$asset"; then
                printf 'Remote asset %s differs from the qualified artifact.\n' "$asset" >&2
                rm -rf "$tmp"
                return 1
              fi
            done
            rm -rf "$tmp"
          }

          draft_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" == "true" ]]; then
              draft_exists=true
              if [[ "$tag_exists" != "true" ]]; then
                draft_target=$(gh release view "$tag" --json targetCommitish \
                  --jq '.targetCommitish')
                if [[ "$draft_target" != "$SOURCE_SHA" ]]; then
                  printf 'Draft %s targets %s instead of qualified source %s.\n' \
                    "$tag" "$draft_target" "$SOURCE_SHA" >&2
                  exit 1
                fi
              fi
              printf 'Restoring interrupted mutable draft %s from sealed qualified assets.\n' \
                "$tag"
              gh release upload "$tag" "${asset_paths[@]}" --clobber
            else
              verify_release_bytes
              echo "Exact immutable release $tag already exists; verified qualified bytes."
              exit 0
            fi
          fi

          if [[ "$draft_exists" != "true" ]]; then
            if [[ "$tag_exists" == "true" ]]; then
              gh release create "$tag" "${asset_paths[@]}" \
                --verify-tag \
                --draft \
                --title "System Monitor $version" \
                --notes "Verified System Monitor ${version} release."
            else
              gh release create "$tag" "${asset_paths[@]}" \
                --target "$SOURCE_SHA" \
                --draft \
                --title "System Monitor $version" \
                --notes "Verified System Monitor ${version} release."
            fi
          fi

          # A draft is intentionally mutable recovery state. Prove the remote
          # asset set and every byte before crossing the publication boundary,
          # then prove the same immutable state once more afterwards.
          verify_release_bytes
          gh release edit "$tag" --draft=false --latest
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "false"
          verify_release_bytes
