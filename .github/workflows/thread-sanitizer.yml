# SPDX-License-Identifier: GPL-3.0-or-later
name: ThreadSanitizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thread-sanitizer-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  process-worker-races:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgtk-3-dev pkg-config

      - name: Race-check asynchronous process worker ownership
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's prebuilt GLib is not TSan-instrumented and uses internal
          # synchronisation that TSan cannot fully observe. Ignore interceptor
          # accesses originating inside non-instrumented modules while keeping
          # System Monitor and Common fully instrumented; application-owned
          # races therefore remain reportable.
          export TSAN_OPTIONS='halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1'
          make ENABLE_LTO=0 CFLAGS='-O1 -g' \
            CC='gcc -fsanitize=thread -fno-omit-frame-pointer' \
            async-workers-smoke
