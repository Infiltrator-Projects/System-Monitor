name: One-shot release tag repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-release-tags.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair retained release tags'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore retained tags to their verified release commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Repair exact release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          declare -A release_sha=(
            [v1.0.59]=1ecea9832ac6423de5cc455dfbdfd21254ed18b2
            [v1.0.60]=f08b7f39abb692650d63806bf598c7abedea86fb
            [v1.0.61]=4f0e190de36a8352ef8d762ffc692aa20ac80d86
            [v1.0.62]=d03d666f2c48f86dc459bea2aeef242c60c8984c
            [v1.0.63]=5c6a6c58d220aec6fdf41187ef86d6fbbeb0725c
          )

          for tag in v1.0.59 v1.0.60 v1.0.61 v1.0.62 v1.0.63; do
            sha="${release_sha[$tag]}"
            version="${tag#v}"
            git cat-file -e "${sha}^{commit}"
            actual_version="$(git show "${sha}:support/VERSION" | tr -d '[:space:]')"
            test "$actual_version" = "$version"

            git push origin ":refs/tags/$tag"
            git tag -f "$tag" "$sha"
            git push origin "refs/tags/$tag:refs/tags/$tag"

            remote_sha="$(git ls-remote --tags --refs origin "refs/tags/$tag" | awk '{print $1}')"
            test "$remote_sha" = "$sha"

            release_id="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100"               --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1)"
            test -n "$release_id"
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/$release_id"               -f target_commitish="$sha" >/dev/null
            echo "Restored $tag -> $sha"
          done
