name: Apply coupling refactor once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: retry coupling refactor patch'
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 10
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Ensure Git is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v git >/dev/null 2>&1; then
            git --version
            exit 0
          fi
          git_root="$RUNNER_TEMP/system-monitor-refactor-git"
          package_dir="$RUNNER_TEMP/system-monitor-refactor-git-package"
          rm -rf "$git_root" "$package_dir"
          mkdir -p "$git_root" "$package_dir"
          (
            cd "$package_dir"
            apt-get download git
            package="$(find . -maxdepth 1 -type f -name 'git_*.deb' -print -quit)"
            test -n "$package"
            dpkg-deb -x "$package" "$git_root"
          )
          test -x "$git_root/usr/bin/git"
          echo "$git_root/usr/bin" >> "$GITHUB_PATH"
          echo "GIT_EXEC_PATH=$git_root/usr/lib/git-core" >> "$GITHUB_ENV"

      - name: Check out exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply bounded architecture patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text, old, new, expected=1, label='replacement'):
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {found}')
              return text.replace(old, new)

          main_path = Path('src/main_windows.c')
          main = main_path.read_text()
          old_state = '''    bool process_backend_attempted;\n    LsmProcessBackend *process_backend; /* Owned exclusively by process_thread. */\n    HANDLE process_thread;\n    HANDLE process_event;\n    CRITICAL_SECTION process_lock;\n    bool process_lock_initialised;\n    bool process_worker_abandoned;\n    bool process_stop_requested;\n    bool process_request_pending;\n    unsigned process_requested_flags;\n    LsmProcessInfo *process_completed;\n    size_t process_completed_count;\n    bool process_completed_ready;\n'''
          new_state = '''    bool process_backend_attempted;\n    LsmWindowsProcessWorker *process_worker;\n'''
          main = replace_exact(main, old_state, new_state, label='Windows UI process state')

          main, removed = re.subn(
              r'static DWORD WINAPI process_worker_main\(LPVOID user_data\)\n\{.*?\n\}\n\nstatic void refresh_processes',
              'static void refresh_processes', main, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit(f'embedded Windows process worker: expected 1 block, removed {removed}')

          main = replace_exact(
              main,
              '    if (!state->process_thread) {\n'
              '        set_status(state, L"Processes backend unavailable");\n'
              '        return;\n'
              '    }\n\n'
              '    request_process_snapshot(state, LSM_PROCESS_SCAN_NONE);',
              '    if (!state->process_worker) {\n'
              '        set_status(state, L"Processes backend unavailable");\n'
              '        return;\n'
              '    }\n\n'
              '    (void)lsm_windows_process_worker_request(\n'
              '        state->process_worker, LSM_PROCESS_SCAN_NONE);',
              label='Processes worker request')
          main = replace_exact(
              main,
              '    if (!take_process_snapshot(state, &processes, &count)) {',
              '    if (!lsm_windows_process_worker_take(\n'
              '            state->process_worker, &processes, &count)) {',
              label='Processes worker take')
          main = replace_exact(
              main,
              '    if (!state || !state->process_thread) return;\n'
              '    request_process_snapshot(state, LSM_PROCESS_SCAN_NONE);',
              '    if (!state || !state->process_worker) return;\n'
              '    (void)lsm_windows_process_worker_request(\n'
              '        state->process_worker, LSM_PROCESS_SCAN_NONE);',
              label='Overview worker request')
          main = replace_exact(
              main,
              '    if (!take_process_snapshot(state, &processes, &count)) return;',
              '    if (!lsm_windows_process_worker_take(\n'
              '            state->process_worker, &processes, &count))\n'
              '        return;',
              label='Overview worker take')
          main = replace_exact(
              main,
              '    state->process_backend_attempted = true;\n'
              '    if (!start_process_worker(state))\n'
              '        set_status(state, L"Processes backend unavailable");',
              '    state->process_backend_attempted = true;\n'
              '    state->process_worker = lsm_windows_process_worker_create();\n'
              '    if (!state->process_worker)\n'
              '        set_status(state, L"Processes backend unavailable");',
              label='Windows process worker initialization')
          main = replace_exact(
              main,
              '    if (state->window) KillTimer(state->window, LSM_WINDOWS_TIMER_ID);\n'
              '    const bool process_worker_stopped = stop_process_worker(state);\n'
              '    lsm_process_list_free(state->processes);\n'
              '    state->processes = NULL;\n'
              '    state->process_count = 0U;\n\n'
              '    if (process_worker_stopped)\n'
              '        state->process_backend = NULL;',
              '    if (state->window) KillTimer(state->window, LSM_WINDOWS_TIMER_ID);\n'
              '    lsm_windows_process_worker_destroy(state->process_worker);\n'
              '    state->process_worker = NULL;\n'
              '    lsm_process_list_free(state->processes);\n'
              '    state->processes = NULL;\n'
              '    state->process_count = 0U;',
              label='Windows process worker teardown')
          main = replace_exact(
              main,
              '    const int status = (int)message.wParam;\n'
              '    /*\n'
              '     * A process worker that ignored cancellation still owns process-related\n'
              '     * members of this state until process termination. Intentionally leave\n'
              '     * that one state allocation to the OS in this exceptional shutdown path;\n'
              '     * freeing it here would create a use-after-free race.\n'
              '     */\n'
              '    if (!state->process_worker_abandoned)\n'
              '        free(state);\n'
              '    return status;',
              '    const int status = (int)message.wParam;\n'
              '    free(state);\n'
              '    return status;',
              label='Windows final state release')

          forbidden = (
              'process_thread', 'process_event', 'process_lock',
              'process_worker_abandoned', 'process_stop_requested',
              'process_request_pending', 'process_requested_flags',
              'process_completed_ready', 'process_completed_count',
              'state->process_completed', 'LsmProcessBackend *process_backend'
          )
          remaining = [token for token in forbidden if token in main]
          if remaining:
              raise SystemExit(f'Win32 shell still owns worker internals: {remaining}')
          main_path.write_text(main)

          cmake_path = Path('CMakeLists.txt')
          cmake = cmake_path.read_text()
          cmake = replace_exact(
              cmake,
              '        support/tests/history_retention_smoke.c src/history.c\n'
              '        src/temporal_presentation.c src/ui_helpers.c)',
              '        support/tests/history_retention_smoke.c src/history.c\n'
              '        src/history_persistence.c\n'
              '        src/temporal_presentation.c src/ui_helpers.c)',
              label='CMake history persistence smoke')
          cmake_path.write_text(cmake)

          make_path = Path('Makefile')
          make = make_path.read_text()
          old_history = 'support/tests/history_retention_smoke.c src/history.c src/temporal_presentation.c \\\n'
          count = make.count(old_history)
          if count != 2:
              raise SystemExit(f'Make history persistence smoke: expected 2 matches, found {count}')
          make = make.replace(
              old_history,
              'support/tests/history_retention_smoke.c src/history.c src/history_persistence.c \\\n')
          make_path.write_text(make)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          ci = replace_exact(
              ci,
              '            src/overview_history.c src/monitor_backend_windows.c src/process_backend_windows.c \\\n',
              '            src/overview_history.c src/monitor_backend_windows.c src/process_backend_windows.c \\\n'
              '            src/process_backend_windows_worker.c \\\n',
              label='Windows worker cross-compile source')
          ci_path.write_text(ci)

          version_path = Path('support/VERSION')
          version = version_path.read_text().strip()
          if version != '1.0.178':
              raise SystemExit(f'expected source version 1.0.178, found {version}')
          version_path.write_text('1.0.179\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = replace_exact(
              readme,
              '**Current source version:** 1.0.178',
              '**Current source version:** 1.0.179',
              label='README source version')
          readme_path.write_text(readme)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          entry = '''## 1.0.179 - 2026-10-11\n\n- Move native Windows process-worker ownership out of the Win32 presentation shell into an opaque, reference-counted backend owner so an uncancellable scan no longer retains the complete UI state.\n- Move App History save snapshots, serialization, generation ordering and durable publication into a dedicated persistence owner.\n- Move technical process-cell formatting and heatmap policy out of Details into the shared process-table presentation layer behind a narrow display context.\n\n'''
          changelog = replace_exact(
              changelog, '# Changelog\n\n', '# Changelog\n\n' + entry,
              label='1.0.179 changelog')
          changelog_path.write_text(changelog)

          sources = Path('support/sources.txt').read_text()
          for required in ('history_persistence.c', 'process_backend_windows_worker.c'):
              if sources.count(required) != 1:
                  raise SystemExit(f'source manifest does not own exactly one {required}')

          Path('.github/workflows/refactor-once.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'refactor: complete top coupling cleanup'
          git push origin HEAD:main
