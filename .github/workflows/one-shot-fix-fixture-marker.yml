name: One-shot native-installer marker correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-fixture-marker.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Make fixture marker independent of sudo environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('support/tests/native_installer_safety.c')
          text = path.read_text(encoding='utf-8')
          old = '''    const char *source_root = getenv("LSM_SAFETY_SOURCE");
    if (!source_root) return EXIT_FAILURE;
    make_directories("/Programs", 0755);
    char executable[LSM_SAFETY_PATH_LEN];
    if (!realpath(argv[0], executable)) return EXIT_FAILURE;
    copy_regular_file(executable, "/Programs/system-monitor", 0755);

    char marker[LSM_SAFETY_PATH_LEN];
    if (!join_path(marker, sizeof(marker), source_root,
                   ".mock-installed-system-monitor"))
        return EXIT_FAILURE;
'''
          new = '''    make_directories("/Programs", 0755);
    char executable[LSM_SAFETY_PATH_LEN];
    if (!realpath(argv[0], executable)) return EXIT_FAILURE;
    copy_regular_file(executable, "/Programs/system-monitor", 0755);

    /* Keep fixture ownership state beside the isolated mock command set. This
     * remains deterministic across sudo's environment sanitisation and cannot
     * be confused with production package state. */
    char mock_directory[LSM_SAFETY_PATH_LEN];
    parent_path(argv[0], mock_directory, sizeof(mock_directory));
    char marker[LSM_SAFETY_PATH_LEN];
    if (!join_path(marker, sizeof(marker), mock_directory,
                   ".mock-installed-system-monitor"))
        return EXIT_FAILURE;
'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected mock dpkg marker block')
          text = text.replace(old, new, 1)
          text = text.replace('static void cleanup_mock_install(const char *source_root)\n{\n',
                              'static void cleanup_mock_install(const char *mock_path)\n{\n', 1)
          text = text.replace('    if (!join_path(marker, sizeof(marker), source_root,\n                   ".mock-installed-system-monitor") ||\n',
                              '    if (!join_path(marker, sizeof(marker), mock_path,\n                   ".mock-installed-system-monitor") ||\n', 1)
          text = text.replace('    cleanup_mock_install(source_root);\n',
                              '    cleanup_mock_install(mock_path);\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git add support/tests/native_installer_safety.c
          git diff --cached --check
          git config user.name 'The-First-Infiltrator'
          git config user.email 'The-First-Infiltrator@users.noreply.github.com'
          git commit -m 'Make native installer fixture sudo-safe'
          git push origin HEAD:main
