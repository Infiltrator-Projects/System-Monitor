# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply structural coupling refactor

on:
  push:
    branches: [refactor/structural-coupling-2026-10-11]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Apply bounded refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 support/tools/apply_structural_coupling_refactor.py
          rm -f support/.structural-refactor-trigger
          git diff --check

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "System Monitor structural refactor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: apply structural coupling guardrails"
          git push origin HEAD:refactor/structural-coupling-2026-10-11
