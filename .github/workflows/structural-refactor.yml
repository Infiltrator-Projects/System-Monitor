# SPDX-License-Identifier: GPL-3.0-or-later
name: Harden and verify structural coupling branch

on:
  push:
    branches: [refactor/structural-coupling-2026-10-11]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 30
    steps:
      - name: Check out branch and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Harden ownership guardrails
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          portability = Path('support/tools/check_portability.c')
          text = portability.read_text(encoding='utf-8')
          old = '        if (ends_with(sources.items[index], "_windows.c") ||\n'
          new = ('        if (strncmp(sources.items[index], "windows_", 8U) == 0 ||\n'
                 '            ends_with(sources.items[index], "_windows.c") ||\n')
          if text.count(old) != 1:
              raise SystemExit('portability Windows-owner exclusion marker not unique')
          portability.write_text(text.replace(old, new, 1), encoding='utf-8')

          checker = Path('support/tools/check_source_style.cpp')
          text = checker.read_text(encoding='utf-8')
          old = ('        require_text_marker(".github/workflows/ci.yml", ci,\n'
                 '                            "gcc-multilib");\n')
          new = old + (
              '        require_text_marker(".github/workflows/ci.yml", ci,\n'
              '                            "support/source-groups/windows-product.txt");\n'
              '        require_text_marker(".github/workflows/ci.yml", ci,\n'
              '                            "mapfile -t windows_sources");\n'
              '        require_text_marker(".github/workflows/ci.yml", ci,\n'
              '                            "$windowsSources = Get-Content \'support/source-groups/windows-product.txt\'");\n'
          )
          if text.count(old) != 1:
              raise SystemExit('CI contract insertion marker not unique')
          checker.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Run canonical verification
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          make -j2 check

      - name: Cross-compile Windows product from canonical group
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          mkdir -p build-structural
          version_header=build-structural/windows-version.h
          printf '#define LSM_VERSION "%s"\n' "$version" > "$version_header"
          mapfile -t windows_sources < <(
            sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
              support/source-groups/windows-product.txt | sed 's#^#src/#'
          )
          common_portable=(
            src/infiltratr-common/src/core.c
            src/infiltratr-common/src/arithmetic.c
            src/infiltratr-common/src/config.c
            src/infiltratr-common/src/i18n.c
            src/infiltratr-common/src/token.c
            src/infiltratr-common/src/timing.c
            src/infiltratr-common/src/temporal.c
            src/infiltratr-common/src/format.c
            src/infiltratr-common/src/quantity.c
            src/infiltratr-common/src/graphics.c
            src/infiltratr-common/src/escape.c
            src/infiltratr-common/src/design.c
          )
          x86_64-w64-mingw32-gcc \
            -std=c17 -O2 -D_WIN32_WINNT=0x0601 -DUNICODE -D_UNICODE \
            -Wall -Wextra -Wpedantic -Werror -Wshadow -Wformat=2 -Wundef \
            -Wstrict-prototypes -Wmissing-prototypes \
            -Isrc -Isrc/infiltratr-common/include -include "$version_header" \
            "${windows_sources[@]}" "${common_portable[@]}" \
            -lpsapi -ladvapi32 -liphlpapi -lws2_32 -lpdh -lpowrprof \
            -ldxgi -ldxguid -lsetupapi -luuid -lcomctl32 -lgdi32 -ldwmapi \
            -static-libgcc -mwindows -o build-structural/system-monitor-windows.exe

      - name: Build with CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-structural-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-structural-cmake --target system-monitor --parallel 2

      - name: Commit validated guardrails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "System Monitor structural refactor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add support/tools/check_portability.c support/tools/check_source_style.cpp
          git diff --cached --quiet && exit 0
          git commit -m "build: enforce structural source boundaries"
          git push origin HEAD:refactor/structural-coupling-2026-10-11
