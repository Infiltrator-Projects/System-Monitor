# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify structural coupling branch

on:
  push:
    branches: [refactor/structural-coupling-2026-10-11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, linux-native, bigbedroom]
    timeout-minutes: 30
    steps:
      - name: Check out branch and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run canonical verification
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 65536
          make -j2 check

      - name: Cross-compile Windows product from canonical group
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < support/VERSION)
          mkdir -p build-structural
          version_header=build-structural/windows-version.h
          printf '#define LSM_VERSION "%s"\n' "$version" > "$version_header"
          mapfile -t windows_sources < <(
            sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
              support/source-groups/windows-product.txt | sed 's#^#src/#'
          )
          common_portable=(
            src/infiltratr-common/src/core.c
            src/infiltratr-common/src/arithmetic.c
            src/infiltratr-common/src/config.c
            src/infiltratr-common/src/i18n.c
            src/infiltratr-common/src/token.c
            src/infiltratr-common/src/timing.c
            src/infiltratr-common/src/temporal.c
            src/infiltratr-common/src/format.c
            src/infiltratr-common/src/quantity.c
            src/infiltratr-common/src/graphics.c
            src/infiltratr-common/src/escape.c
            src/infiltratr-common/src/design.c
          )
          x86_64-w64-mingw32-gcc \
            -std=c17 -O2 -D_WIN32_WINNT=0x0601 -DUNICODE -D_UNICODE \
            -Wall -Wextra -Wpedantic -Werror -Wshadow -Wformat=2 -Wundef \
            -Wstrict-prototypes -Wmissing-prototypes \
            -Isrc -Isrc/infiltratr-common/include -include "$version_header" \
            "${windows_sources[@]}" "${common_portable[@]}" \
            -lpsapi -ladvapi32 -liphlpapi -lws2_32 -lpdh -lpowrprof \
            -ldxgi -ldxguid -lsetupapi -luuid -lcomctl32 -lgdi32 -ldwmapi \
            -static-libgcc -mwindows -o build-structural/system-monitor-windows.exe

      - name: Build with CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-structural-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-structural-cmake --target system-monitor --parallel 2
