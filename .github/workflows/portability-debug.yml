# SPDX-License-Identifier: GPL-3.0-or-later
name: Portability probe diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'audit-repair-1.13.17'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit-repair-1.13.17
          submodules: recursive
      - name: Install multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
      - name: Run exact checker probe visibly
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/lsm-probe.c <<'EOF'
          #include <stdint.h>
          #include <time.h>
          int value(void){return (int)(sizeof(void*) + sizeof(time_t));}
          EOF
          cc -m32 -std=c17 -O2 \
            -Isrc -Isupport/tests/compat -Isrc/infiltratr-common/include \
            '-DLSM_VERSION="1.13.17"' -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 \
            -include src/glibc_compat.h \
            -Wall -Wextra -Wpedantic -Werror -Wshadow -Wformat=2 -Wundef \
            -Wstrict-prototypes -Wmissing-prototypes -Wcast-qual -Wwrite-strings \
            -Wswitch-enum -Wnull-dereference -pthread -c /tmp/lsm-probe.c \
            -o /tmp/lsm-probe.o
          readelf -h /tmp/lsm-probe.o
          file /tmp/lsm-probe.o
